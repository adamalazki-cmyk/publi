<script>
/* =========================================================================
   THERMOLINE — static stress screening for pre-insulated bonded DH/DC pipes
   Calculation basis: EN 13941-1 / EN 253, cross-checked against the
   Kingspan LOGSTOR "Design — Single Pipes" manual (04/2024) and comparable
   isoplus guidance. See METHOD modal for the full basis and limitations.
   ========================================================================= */
/* ============================ 1. REFERENCE DATA ========================== */

/* Steel service pipe per EN 253. As back-calculated from LOGSTOR tables
   (As = pi*t*(d-t)); casing OD for insulation Series 1 / 2 / 3.          */
const PIPES=[
 {dn:20,  d:26.9,  t:2.6,  As:198,  Dc:[90,110,125]},
 {dn:25,  d:33.7,  t:2.6,  As:254,  Dc:[90,110,125]},
 {dn:32,  d:42.4,  t:2.6,  As:325,  Dc:[110,125,140]},
 {dn:40,  d:48.3,  t:2.6,  As:373,  Dc:[110,125,140]},
 {dn:50,  d:60.3,  t:2.9,  As:523,  Dc:[125,140,160]},
 {dn:65,  d:76.1,  t:2.9,  As:667,  Dc:[140,160,180]},
 {dn:80,  d:88.9,  t:3.2,  As:862,  Dc:[160,200,200]},
 {dn:100, d:114.3, t:3.6,  As:1252, Dc:[200,225,250]},
 {dn:125, d:139.7, t:3.6,  As:1539, Dc:[225,250,280]},
 {dn:150, d:168.3, t:4.0,  As:2065, Dc:[250,280,315]},
 {dn:200, d:219.1, t:4.5,  As:3034, Dc:[315,355,400]},
 {dn:250, d:273.0, t:5.0,  As:4210, Dc:[400,450,500]},
 {dn:300, d:323.9, t:5.6,  As:5600, Dc:[450,500,560]},
 {dn:350, d:355.6, t:5.6,  As:6158, Dc:[500,560,630]},
 {dn:400, d:406.4, t:6.3,  As:7919, Dc:[560,640,710]},
 {dn:450, d:457.0, t:6.3,  As:8920, Dc:[630,710,800]},
 {dn:500, d:508.0, t:6.3,  As:9930, Dc:[710,800,900]},
 {dn:600, d:610.0, t:7.1,  As:13448,Dc:[800,900,1000]},
 {dn:700, d:711.0, t:8.0,  As:17663,Dc:[900,1000,1100]},
 {dn:800, d:813.0, t:8.8,  As:22233,Dc:[1000,1100,1200]},
 {dn:900, d:914.0, t:10.0, As:28401,Dc:[1100,1200,1300]},
 {dn:1000,d:1016.0,t:11.0, As:34718,Dc:[1200,1300,1400]}
];
const pipeByDn=dn=>{const d=+dn;return PIPES.find(p=>p.dn===d)||PIPES[7];};

/* Limit state C1 — local stability (buckling/folding) of the service pipe.
   Max axial stress, from the EN 13941 rm/t limit curve as tabulated
   by LOGSTOR. Pipes <= 323.9 mm: 334 MPa (dT 130 K).                     */
const C1=[[323.9,334],[355.6,308],[406.4,279],[457,249],[508,225],[610,212],
          [711,205],[813,198],[914,200],[1016,198],[1219,188]];
function c1Limit(d){
  if(d<=323.9)return 334;
  for(let i=1;i<C1.length;i++){
    if(d<=C1[i][0]){const a=C1[i-1],b=C1[i];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0]);}
  }
  return 188;
}

/* Max soil cover to top of casing (m) — keeps casing shear within EN 13941
   limits. LOGSTOR table, by steel OD and series.                          */
const HMAX={26.9:[2.00,1.70,1.50],33.7:[2.60,2.10,1.80],42.4:[2.60,2.30,2.00],
 48.3:[3.00,2.60,2.30],60.3:[3.30,2.90,2.50],76.1:[3.70,3.30,2.90],
 88.9:[3.60,3.20,2.90],114.3:[3.90,3.40,3.00],139.7:[4.10,3.70,3.30],
 168.3:[4.40,3.90,3.50],219.1:[4.60,4.10,3.60],273:[4.50,4.00,3.50],
 323.9:[4.70,4.20,3.70],355.6:[4.70,4.20,3.60],406.4:[4.70,4.20,3.70],
 457:[4.80,4.20,3.70],508:[4.70,4.10,3.60],610:[4.90,4.30,3.90]};

/* Maximum permitted mitre half-angle vs axial stress level (LOGSTOR).     */
const MITRE=[[150,4],[228,2],[252,1],[280,0.5],[1e9,0]];
function mitreLimit(s){for(const mv of MITRE)if(s<=mv[0])return mv[1];return 0;}

/* PE casing wall thickness, EN 253 (approx, for self-weight only).        */
function tPE(Dc){const T=[[90,3],[110,3],[125,3],[140,3],[160,3],[180,3],[200,3.2],
 [225,3.4],[250,3.6],[280,3.9],[315,4.1],[355,4.5],[400,4.8],[450,5.2],[500,5.6],
 [560,6.0],[630,6.6],[710,7.2],[800,7.8],[900,8.6],[1000,9.4],[1100,10.2],
 [1200,11],[1300,11.8],[1400,12.6]];for(const v of T)if(Dc<=v[0])return v[1];return 13;}

/* Steel properties per EN 13941 (temperature dependent).                  */
const STEEL=[[20,212857,1.16e-5,235],[50,211143,1.18e-5,221],[70,210000,1.19e-5,212],
 [90,208857,1.21e-5,203],[100,208286,1.22e-5,198],[110,207714,1.23e-5,196],
 [120,207143,1.23e-5,194],[130,206571,1.24e-5,191],[140,206000,1.25e-5,189]];
function steelAt(T){
  T=Math.max(20,Math.min(140,T));
  for(let i=1;i<STEEL.length;i++){
    if(T<=STEEL[i][0]){const a=STEEL[i-1],b=STEEL[i],f=(T-a[0])/(b[0]-a[0]);
      return{E:a[1]+(b[1]-a[1])*f,al:a[2]+(b[2]-a[2])*f,Re:a[3]+(b[3]-a[3])*f};}
  }
  return{E:206000,al:1.25e-5,Re:189};
}

const SOILS={
  'sand-dense'  :{name:'Sand, dense / well compacted', g:19,  K0:0.46, mu:0.40, phi:32.5},
  'sand-medium' :{name:'Sand, medium dense',           g:18,  K0:0.50, mu:0.38, phi:30},
  'gravel'      :{name:'Gravel / crushed friction fill',g:20, K0:0.43, mu:0.45, phi:35},
  'silt'        :{name:'Silty sand',                   g:18.5,K0:0.55, mu:0.35, phi:27},
  'clay'        :{name:'Cohesive (clay) surround',     g:19,  K0:0.60, mu:0.30, phi:24},
  'foil'        :{name:'Sand + PE friction-reducing foil',g:19,K0:0.46,mu:0.28, phi:32.5},
  'custom'      :{name:'Custom',                       g:19,  K0:0.46, mu:0.40, phi:32.5}
};

/* Project (design) classes — EN 13941 groups systems mainly by axial stress
   level and rm/t. Safety factors below are TOOL DEFAULTS for screening and
   must be confirmed against the project's adopted values.                 */
const CLASSES={
  A:{name:'A — low axial stress, small/medium DN', gFat:1.00, gStab:1.00,
     hint:'dT below about 85 K, DN 300 or less. Stresses stay under yield.'},
  B:{name:'B — high axial stress, small/medium DN', gFat:1.10, gStab:1.00,
     hint:'Yield exceeded in the restrained zone. DN 300 or less.'},
  C:{name:'C — large DN or high internal pressure', gFat:1.25, gStab:1.10,
     hint:'DN above 300 or p above 16 bar. Detailed analysis normally required.'}
};

/* Low-cycle fatigue design curve for the bonded steel service pipe.
   ds_all = CFAT / N^0.25   (N * ds^4 = constant).
   CFAT = 2811 MPa reproduces published EN 13941 allowables
   (707 MPa at 250 cycles, 750 at 200, 823 at 136).                       */
const CFAT=2811;
const fatAllow=(N,g)=>CFAT/Math.pow(Math.max(1,N),0.25)/(g||1);

/* Equivalent full load cycles by network duty (EN 13941 / LOGSTOR minima). */
const DUTY={transmission:100, distribution:250, service:1000, solar:3000};

/* Stress concentration factors at components — screening defaults.        */
const SCFS={
  plain :{run:1.80, br:2.60, name:'Plain welded branch (unreinforced)'},
  reinf :{run:1.25, br:1.50, name:'Reinforced / saddle branch'},
  forged:{run:1.15, br:1.35, name:'Forged or extruded tee'},
  parallel:{run:1.30,br:1.40,name:'Parallel (swept) branch'}
};
const SCF_BEND=1.6, SCF_MITRE=2.2, SCF_RED=1.5;

/* Foam-pad system (crosslinked PE, 40 mm layers, max 70% compression).    */
const PAD={layer:40, maxLayers:3, comp:0.70, sigPUR:0.15};

/* ============================ 2. MODEL ================================== */

const uid=p=>p+Math.random().toString(36).slice(2,8);

function blankModel(){
  return{
    meta:{name:'Untitled network',ref:'',by:'',client:'',date:new Date().toISOString().slice(0,10),notes:''},
    ops:{medium:'heating',Tmax:110,Tmin:10,Tins:10,Tpre:60,pDesign:16,install:'cold'},
    soil:{preset:'sand-dense',g:19,K0:0.46,mu:0.40,cover:0.8,gwl:99,
          workAllow:100,trenchMax:0,pairGap:0},
    design:{cls:'auto',duty:'distribution',cycles:250,sigMode:'manual',sigAll:190,
            gFat:0,teeType:'plain',flexAngle:70,anchorLimit:150,exactE:false},
    view:{show:'stress',labels:true,angles:true,pads:true,moves:true,grid:true},
    def:{dn:100,series:2},
    nodes:{},edges:{},
    z:{p:[],i:-1}
  };
}
let M=blankModel();
let R=null;
let REF={};   /* id -> tag string, rebuilt each analysis */
let sel={kind:null,id:null};
let hover={kind:null,id:null};
let badgeHover={g:null,px:0,py:0};  /* currently hovered badge group */

function addNode(x,y,type){const id=uid('n');
  M.nodes[id]={id,x,y,type:type||'auto',label:'',padOverride:null,teeType:''};return id;}
function addEdge(a,b,o){const id=uid('e');M.edges[id]=Object.assign({id,a,b,
  dn:M.def.dn,series:M.def.series,cover:null,soil:null},o||{});return id;}
function delNode(id){for(const e of Object.values(M.edges))if(e.a===id||e.b===id)delete M.edges[e.id];
  delete M.nodes[id];}
function delEdge(id){const e=M.edges[id];if(!e)return;delete M.edges[id];
  [e.a,e.b].forEach(n=>{if(!Object.values(M.edges).some(x=>x.a===n||x.b===n))delete M.nodes[n];});}
function degree(id){let d=0;for(const e of Object.values(M.edges))if(e.a===id||e.b===id)d++;return d;}
function edgesAt(id){return Object.values(M.edges).filter(e=>e.a===id||e.b===id);}
function other(e,id){return e.a===id?e.b:e.a;}
function edgeLen(e){const A=M.nodes[e.a],B=M.nodes[e.b];return Math.hypot(B.x-A.x,B.y-A.y);}
function dirFrom(e,from){const A=M.nodes[from],B=M.nodes[other(e,from)];
  const L=Math.hypot(B.x-A.x,B.y-A.y)||1;return{x:(B.x-A.x)/L,y:(B.y-A.y)/L};}

/* undo -------------------------------------------------------------------*/
function snapshot(){
  const s=JSON.stringify({nodes:M.nodes,edges:M.edges,ops:M.ops,soil:M.soil,
    design:M.design,def:M.def,meta:M.meta});
  const z=M.z; if(z.p[z.i]===s)return;
  z.p=z.p.slice(0,z.i+1); z.p.push(s); if(z.p.length>60)z.p.shift();
  z.i=z.p.length-1;
}
function restore(s){const o=JSON.parse(s);Object.assign(M,o);sel={kind:null,id:null};run();}
function undo(){if(M.z.i>0){M.z.i--;restore(M.z.p[M.z.i]);toast('Undo');}}
function redo(){if(M.z.i<M.z.p.length-1){M.z.i++;restore(M.z.p[M.z.i]);toast('Redo');}}

/* ============================ 3. ENGINE ================================= */

/* self weight of water-filled pre-insulated pipe, kN/m */
function selfWeight(p,series){
  const Dc=p.Dc[series-1], tp=tPE(Dc), di=p.d-2*p.t;
  const A=x=>Math.PI*x*x/4e6;
  const mSteel=p.As*1e-6*7850, mWater=A(di)*1000;
  const mPUR=(A(Dc-2*tp)-A(p.d))*80, mPE=(A(Dc)-A(Dc-2*tp))*950;
  return (mSteel+mWater+mPUR+mPE)*9.81/1000;
}

/* soil friction per metre, kN/m
   F = mu * ( (1+K0)/2 * sv * pi * Dc + G - gamma * pi * Dc^2/4 )
   Reproduces LOGSTOR published F tables to within about 1%.              */
function friction(p,series,soil,cover){
  const Dc=p.Dc[series-1]/1000, Z=cover+Dc/2;
  const gwl=(soil.gwl===undefined?99:soil.gwl);
  const dry=Math.min(Z,gwl), wet=Math.max(0,Z-gwl);
  const gEff=Math.max(soil.g-9.81,4);
  const sv=soil.g*dry+gEff*wet;
  const G=selfWeight(p,series);
  const disp=(wet>0?gEff:soil.g)*Math.PI*Dc*Dc/4;
  return Math.max(soil.mu*((1+soil.K0)/2*sv*Math.PI*Dc+G-disp),0.05);
}

function edgeProps(e){
  const p=pipeByDn(e.dn), series=e.series||2;
  const soil={g:M.soil.g,K0:M.soil.K0,mu:M.soil.mu,gwl:M.soil.gwl};
  if(e.soil&&SOILS[e.soil]){const b=SOILS[e.soil];soil.g=b.g;soil.K0=b.K0;soil.mu=b.mu;}
  const cover=e.cover||M.soil.cover;
  return{p,series,soil,cover,Dc:p.Dc[series-1],
         F:friction(p,series,soil,cover),As:p.As,d:p.d,t:p.t,
         I:Math.PI*(Math.pow(p.d,4)-Math.pow(p.d-2*p.t,4))/64};
}

function thermal(){
  const o=M.ops;
  const Tref=o.install==='cold'?o.Tins:o.Tpre;
  const st=steelAt((o.Tmax+o.Tmin)/2);
  const exact=!!M.design.exactE;
  const E=exact?st.E:210000, al=exact?st.al:1.2e-5, Ea=E*al;
  const dTh=Math.max(0,o.Tmax-Tref), dTc=Math.max(0,Tref-o.Tmin);
  return{Tref,Ea,E,al,Re:steelAt(o.Tmax).Re,
    dTheat:dTh,dTcool:dTc,sigC:dTh*Ea,sigT:dTc*Ea,
    sigMax:Math.max(dTh*Ea,dTc*Ea),dSig:Math.abs(o.Tmax-o.Tmin)*Ea,
    dTgov:Math.max(dTh,dTc)};
}

function autoClass(){
  if(M.design.cls!=='auto')return M.design.cls;
  const th=thermal();
  let maxDn=0;for(const e of Object.values(M.edges))maxDn=Math.max(maxDn,e.dn);
  if(maxDn>300||M.ops.pDesign>16)return 'C';
  return th.sigMax>214?'B':'A';
}

function allowables(){
  const th=thermal(), D=M.design, cls=autoClass();
  let maxD=114.3;for(const e of Object.values(M.edges))maxD=Math.max(maxD,pipeByDn(e.dn).d);
  const gFat=D.gFat>0?D.gFat:CLASSES[cls].gFat;
  const N=D.cycles||DUTY[D.duty]||250;
  const c1=c1Limit(maxD)/(CLASSES[cls].gStab||1);
  const sigAll=D.sigMode==='c1'?c1:Math.min(D.sigAll,c1);
  return{cls,gFat,N,c1,sigAll,dsFat:fatAllow(N,gFat),th,maxD};
}

/* empirical foam-pad zone length F (m), fitted to LOGSTOR F-length curves:
   F = 0.124 * d^0.48 * dL^0.25   (d, dL in mm)                           */
const padZone=(d,dL)=>dL<=0?0:0.124*Math.pow(d,0.48)*Math.pow(dL,0.25);
const padLayers=dL=>dL<=5?0:Math.ceil(dL/PAD.comp/PAD.layer);

/* --- network decomposition: pair edges into runs ----------------------- */
function angleAt(nid,e1,e2){
  const d1=dirFrom(e1,nid), d2=dirFrom(e2,nid);
  const dot=Math.max(-1,Math.min(1,d1.x*d2.x+d1.y*d2.y));
  return 180-Math.acos(dot)*180/Math.PI;         /* 0 = straight through */
}
function buildPairs(){
  const pair={};                                  /* nid -> {edgeId:edgeId} */
  for(const n of Object.values(M.nodes)){
    const es=edgesAt(n.id); pair[n.id]={};
    if(es.length===2){pair[n.id][es[0].id]=es[1].id;pair[n.id][es[1].id]=es[0].id;}
    else if(es.length>2){
      let best=null;
      for(let i=0;i<es.length;i++)for(let j=i+1;j<es.length;j++){
        const dev=Math.abs(angleAt(n.id,es[i],es[j]));
        const same=es[i].dn===es[j].dn?-25:0;
        const sc=dev+same;
        if(!best||sc<best.sc)best={sc,i,j,dev};
      }
      if(best&&best.dev<60){
        pair[n.id][es[best.i].id]=es[best.j].id;
        pair[n.id][es[best.j].id]=es[best.i].id;
      }
    }
  }
  return pair;
}
function buildRuns(){
  const pair=buildPairs(), seen=new Set(), runs=[];
  const walk=(n0,e0)=>{
    const ns=[n0], eds=[]; let n=n0,e=e0;
    while(e&&!seen.has(e.id)){
      seen.add(e.id); eds.push(e); n=other(e,n); ns.push(n);
      const nx=pair[n]&&pair[n][e.id]; e=nx?M.edges[nx]:null;
    }
    if(eds.length)runs.push({nodes:ns,edges:eds});
  };
  for(const n of Object.values(M.nodes))
    for(const e of edgesAt(n.id))
      if(!seen.has(e.id)&&!(pair[n.id]&&pair[n.id][e.id]))walk(n.id,e);
  for(const e of Object.values(M.edges))
    if(!seen.has(e.id))walk(e.a,e);
  return{runs,pair};
}

/* node role from topology + user override */
function nodeRole(n,pair){
  const deg=degree(n.id);
  if(n.type&&n.type!=='auto')return n.type;
  if(deg===0)return 'orphan';
  if(deg===1)return 'free';
  if(deg>=3)return 'tee';
  const es=edgesAt(n.id);
  const dev=Math.abs(angleAt(n.id,es[0],es[1]));
  if(es[0].dn!==es[1].dn)return 'reducer';
  return dev<2?'weld':'bend';
}

/* ------------------------- MAIN ANALYSIS ------------------------------- */
function analyse(){
  const {runs,pair}=buildRuns();
  const A=allowables(), th=A.th;
  const F=[];                                        /* findings */
  const NR={},ER={};                                 /* node/edge results */
  const flexA=M.design.flexAngle;
  const push=(sev,code,title,detail,fix,ref,loc)=>F.push({sev,code,title,detail,fix,ref,loc});

  for(const e of Object.values(M.edges))
    ER[e.id]={sigA:0,sigB:0,sigMax:0,util:0,LF:0,pr:edgeProps(e),len:edgeLen(e),sec:null};
  for(const n of Object.values(M.nodes))
    NR[n.id]={role:nodeRole(n,pair),move:{x:0,y:0},dR:0,parts:[],pad:null,anchorF:0,
              sig:0,ds:0,ep:false,fixed:false};

  const sections=[];
  runs.forEach((run,ri)=>{
    run.runIndex=ri;
    /* classify every node on the run */
    const marks=run.nodes.map((nid,i)=>{
      const n=M.nodes[nid], role=NR[nid].role;
      const closed=run.nodes[0]===run.nodes[run.nodes.length-1];
      const term=(i===0||i===run.nodes.length-1)&&!closed;
      let kind='pass';
      if(role==='anchor')kind='fixed';
      else if(role==='ecomp'||role==='loop')kind='free';
      else if(term){
        if(degree(nid)>=3)kind='fixed';             /* branch root at a tee */
        else kind=(role==='free')?'free':'fixed';
      } else if(role==='bend'||role==='reducer'){
        const es=edgesAt(nid);
        const dev=Math.abs(angleAt(nid,es[0],es[1]));
        NR[nid].dev=dev;
        kind=dev>=flexA?'free':'pass';
      }
      if(kind!=='pass'){NR[nid].ep=true;NR[nid].fixed=(kind==='fixed');}
      return kind;
    });
    /* split into sections between marks */
    let start=0;
    for(let i=1;i<run.nodes.length;i++){
      if(marks[i]!=='pass'||i===run.nodes.length-1){
        const idx0=start,idx1=i;
        const segs=run.edges.slice(idx0,idx1);
        if(segs.length){
          sections.push({id:'S'+(sections.length+1),run:ri,
            n0:run.nodes[idx0],n1:run.nodes[idx1],
            e0:marks[idx0]==='fixed'?'fixed':'free',
            e1:marks[idx1]==='fixed'?'fixed':'free',
            edges:segs, i0:idx0, i1:idx1});
        }
        start=i;
      }
    }
  });

  /* ---- per-section mechanics ---- */
  sections.forEach(S=>{
    let L=0,sumF=0,sumAs=0,minAs=1e9,maxD=0,dnSet=new Set();
    S.edges.forEach(e=>{const p=ER[e.id].pr,l=ER[e.id].len;
      L+=l;sumF+=p.F*l;sumAs+=p.As*l;minAs=Math.min(minAs,p.As);
      maxD=Math.max(maxD,p.d);dnSet.add(e.dn);});
    const f=(sumF/L)*1000;                          /* N/m */
    const As=sumAs/L;                               /* mm2 */
    const sigMax=th.sigMax;
    const LF=sigMax*As/f;                           /* m */
    S.L=L; S.f=f/1000; S.As=As; S.LF=LF; S.maxD=maxD; S.mixed=dnSet.size>1;
    S.sigFull=sigMax; S.Lall=A.sigAll*As/f;
    const both = S.e0==='free'&&S.e1==='free';
    const none = S.e0==='fixed'&&S.e1==='fixed';

    if(none){ S.sig=sigMax; S.lock=L; S.Lx0=0; S.Lx1=0; }
    else if(both){
      if(L>=2*LF){S.sig=sigMax;S.lock=L-2*LF;S.Lx0=LF;S.Lx1=LF;}
      else{S.sig=0.5*L*f/As;S.lock=0;S.Lx0=L/2;S.Lx1=L/2;}
    } else {
      const freeIs0=S.e0==='free';
      const Lx=Math.min(L,LF);
      S.sig=Math.min(sigMax,L*f/As);
      if(L>=LF)S.sig=sigMax;
      S.lock=Math.max(0,L-LF);
      S.Lx0=freeIs0?Lx:0; S.Lx1=freeIs0?0:Lx;
      S.anchorSide=As*sigMax-Math.min(f*L,As*sigMax);
    }
    if(none)S.anchorSide=As*sigMax;
    S.util=S.sig/A.sigAll;

    /* stress at distance x from n0 */
    S.sigAt=x=>{
      const a=S.e0==='fixed'?sigMax:Math.min(sigMax,x*f/As);
      const b=S.e1==='fixed'?sigMax:Math.min(sigMax,(L-x)*f/As);
      return Math.min(sigMax,Math.min(a,b));
    };
    /* map onto edges */
    let x=0;
    S.edges.forEach(e=>{
      const r=ER[e.id], l=r.len;
      r.sec=S.id; r.x0=x; r.x1=x+l;
      r.sigA=S.sigAt(x); r.sigB=S.sigAt(x+l);
      r.sigMax=Math.max(r.sigA,r.sigB,S.sigAt((x+l/2)));
      r.util=r.sigMax/A.sigAll; r.LF=LF; r.Lall=S.Lall;
      x+=l;
    });

    /* movements at the two ends */
    const mv=(Lx)=>{
      if(Lx<=0)return 0;
      const Lm=Lx*1000;
      return Math.max(0, th.al*th.dTgov*Lm - S.f*1000*Lm*Lm/(2*As*th.E)/1000 );
    };
    S.d0=mv(S.Lx0); S.d1=mv(S.Lx1);
  });

  /* movement contributions to nodes */
  sections.forEach(S=>{
    const first=S.edges[0], last=S.edges[S.edges.length-1];
    if(S.d0>0){
      const u=dirFrom(first,other(first,S.n0));      /* points toward n0 */
      NR[S.n0].move.x+=u.x*S.d0; NR[S.n0].move.y+=u.y*S.d0;
      NR[S.n0].parts.push({sec:S.id,d:S.d0,ux:u.x,uy:u.y});
    }
    if(S.d1>0){
      const u=dirFrom(last,other(last,S.n1));
      NR[S.n1].move.x+=u.x*S.d1; NR[S.n1].move.y+=u.y*S.d1;
      NR[S.n1].parts.push({sec:S.id,d:S.d1,ux:u.x,uy:u.y});
    }
    NR[S.n0].sig=Math.max(NR[S.n0].sig,S.sigAt(0));
    NR[S.n1].sig=Math.max(NR[S.n1].sig,S.sigAt(S.L));
    if(S.anchorSide){
      if(S.e0==='fixed')NR[S.n0].sides=(NR[S.n0].sides||[]).concat(S.anchorSide);
      if(S.e1==='fixed')NR[S.n1].sides=(NR[S.n1].sides||[]).concat(S.anchorSide);
    }
  });
  for(const nid in NR){
    const r=NR[nid];
    r.dR=Math.hypot(r.move.x,r.move.y);
    if(r.sides&&r.sides.length){
      r.anchorF=(r.sides.length>1)?Math.abs(r.sides[0]-r.sides[1]):r.sides[0];
      r.anchorF/=1000;                               /* kN */
    }
  }

  /* helper: distance of a node from S.n0 along the section */
  const posIn=(S,nid)=>{let x=0,cur=S.n0;
    for(const e of S.edges){if(cur===nid)return x;x+=ER[e.id].len;cur=other(e,cur);}
    return cur===nid?x:null;};
  const secOf=nid=>sections.find(S=>posIn(S,nid)!==null);
  const secsAt=nid=>sections.filter(S=>S.n0===nid||S.n1===nid);

  /* main-pipe movement at an interior point (LOGSTOR branch formula) */
  function moveAt(S,x){
    if(S.e0==='fixed'&&S.e1==='fixed')return{d:0,dir:0};
    let Lp,s,dir;
    if(S.e0==='free'&&S.e1==='free'){
      const va=S.L/2;
      if(x<va){Lp=Math.min(va,S.LF); s=Lp-x; dir=-1;}
      else{Lp=Math.min(va,S.LF); s=Lp-(S.L-x); dir=+1;}
    } else if(S.e0==='free'){Lp=Math.min(S.L,S.LF); s=Lp-x; dir=-1;}
    else{Lp=Math.min(S.L,S.LF); s=Lp-(S.L-x); dir=+1;}
    if(s<=0)return{d:0,dir};
    const sm=s*1000, Lm=Lp*1000;
    const d=th.al*th.dTgov*sm - S.f*(2*Lm-sm)*sm/(2*th.E*S.As);
    return{d:Math.max(0,d),dir};
  }

  /* how far a pad zone can run from a node before it meets the next
     feature (bend, tee, anchor, reducer, terminal). Pads cannot be laid
     through a mitred weld or past a fitting.                             */
  function legReach(nid,e0){
    let len=0,cur=nid,ed=e0,last=e0,guard=0;
    while(ed&&guard++<400){
      len+=ER[ed.id].len; last=ed;
      const nx=other(ed,cur), rr=NR[nx];
      if(!rr||degree(nx)!==2||rr.ep||rr.role!=='weld')
        return{len,end:nx,role:rr?rr.role:'end',lastEdge:ed};
      const es=edgesAt(nx); ed=(es[0].id===ed.id)?es[1]:es[0]; cur=nx;
    }
    return{len,end:cur,role:'end',lastEdge:last};
  }
  const otherEdge=(nid,exId)=>{const es=edgesAt(nid);
    return es.length===2?(es[0].id===exId?es[1]:es[0]):null;};

  /* ======================= NODE-LEVEL CHECKS ========================== */
  const teeReport=[], bendReport=[], branchReport=[];
  function R_bendSync(){
    bendReport.forEach(br=>{
      const r2=NR[br.n]; if(!r2||!r2.pad)return;
      const pd=r2.pad.legs.filter(l=>l.F>0.05);
      br.F=r2.pad.F; br.layers=r2.pad.layers; br.dR=r2.pad.dR;
      br.trench=r2.pad.trench; br.approx=!!r2.pad.approx;
      br.avail=pd.length?Math.min(...pd.map(l=>l.avail)):0;
      br.fit=pd.every(l=>l.F<=l.avail+0.05);
    });
  }

  for(const n of Object.values(M.nodes)){
    const r=NR[n.id], role=r.role, es=edgesAt(n.id);
    if(!es.length)continue;
    const pr=edgeProps(es[0]);
    const dsLocal=th.sigMax>0?(r.sig/th.sigMax)*th.dSig:0;
    r.ds=dsLocal;

    /* --- flexible bends / expansion points ---------------------------- */
    if((role==='bend'||role==='loop'||role==='ecomp')&&r.ep){
      const layers=padLayers(r.dR);
      /* A leg is padded to take the movement arriving ACROSS it, i.e. the
         component of the bend's displacement perpendicular to that leg.
         For a 90 deg L-bend that is the other leg's axial expansion.     */
      const legs=es.map(e=>{
        const u=dirFrom(e,n.id);
        const along=r.move.x*u.x+r.move.y*u.y;
        const lat=Math.hypot(r.move.x-along*u.x,r.move.y-along*u.y);
        const pe=edgeProps(e), rc=legReach(n.id,e);
        return{e:e.id,dn:e.dn,Dc:pe.Dc,d:lat,F:padZone(pe.d,lat),
               avail:rc.len,end:rc.end,endRole:rc.role,lastEdge:rc.lastEdge.id};
      });
      const Fmax=Math.max(0,...legs.map(l=>l.F));
      const maxDc=Math.max(...legs.map(l=>l.Dc));
      const tPad=layers*PAD.layer;
      const trench=(maxDc+2*tPad+2*(M.soil.workAllow||0))/1000;
      r.pad={dR:r.dR,layers,t:tPad,F:Fmax,legs,trench,maxDc,
             lengths:[Fmax,Fmax/2,Fmax/4].slice(0,Math.max(1,Math.min(3,layers)))};
      const padded=legs.filter(l=>l.F>0.05);
      bendReport.push({n:n.id,dev:r.dev||90,dR:r.dR,layers,F:Fmax,sig:r.sig,
        avail:padded.length?Math.min(...padded.map(l=>l.avail)):0,trench,
        fit:padded.every(l=>l.F<=l.avail+0.05)});

      if(SCF_BEND*dsLocal>A.dsFat)
        push('high','FAT-2','Bend fatigue utilisation exceeded',
          'Stress range at the bend '+(SCF_BEND*dsLocal).toFixed(0)+' MPa (SCF '+SCF_BEND+
          ') against allowable '+A.dsFat.toFixed(0)+' MPa for '+A.N+' equivalent full cycles.',
          'Reduce the operating temperature range, lower the axial stress level, or use a large-radius curved pipe instead of a welded elbow.',
          'EN 13941 fatigue',{k:'node',id:n.id});
    }

    /* --- shallow direction changes ------------------------------------ */
    if(role==='bend'&&!r.ep){
      const dev=r.dev||0;
      if(dev>0.4){
        const lim=mitreLimit(r.sig), Rmin=500*pr.d/1000;
        const sev=dev/2>lim?'watch':'info';
        push(sev,'DIR-1','Shallow direction change of '+dev.toFixed(1)+'\u00b0',
          'At '+r.sig.toFixed(0)+' MPa axial stress the permitted mitre half-angle is '+lim+
          '\u00b0 (here '+(dev/2).toFixed(1)+'\u00b0). This node does not relieve axial stress: only bends of about 80-90\u00b0 expand freely.',
          dev/2>lim?('Form the change as an elastic curve (min radius '+Rmin.toFixed(0)+
            ' m for DN'+es[0].dn+') or a prefabricated curved pipe, not a mitred weld.')
           :('A mitred weld is acceptable at this stress level; keep successive mitres at least '+
            (20*pr.d/1000).toFixed(1)+' m apart.'),
          'Mitre / elastic curve limits',{k:'node',id:n.id});
      }
    }

    /* --- anchors ------------------------------------------------------ */
    if(role==='anchor'){
      const kN=r.anchorF||0;
      r.anchor={F:kN};
      push(kN>0?'info':'info','ANC-1','Anchor force '+kN.toFixed(0)+' kN',
        'Unbalanced axial force to be taken by the fixed point. Pipe axial stress at the anchor '+
        r.sig.toFixed(0)+' MPa.',
        'Size the concrete block for '+kN.toFixed(0)+
        ' kN against the allowable soil bearing pressure, and confirm the casing/foam shear transfer length.',
        'EN 13941 fixed points',{k:'node',id:n.id});
      if(r.sig>M.design.anchorLimit)
        push('watch','ANC-2','Axial stress at anchor above the adopted limit',
          r.sig.toFixed(0)+' MPa exceeds the '+M.design.anchorLimit+
          ' MPa stress-difference limit normally applied where a cast anchor is installed.',
          'Reduce stress locally with an expansion bend, E-comp or heat pre-stressing before the anchor, or delete the anchor and let friction control the movement.',
          'Manufacturer anchor rule',{k:'node',id:n.id});
    }

    /* --- free ends ---------------------------------------------------- */
    if(role==='free'&&r.ep&&r.dR>0){
      if(r.dR>150)
        push('watch','END-1','Large movement at free end',
          'First-time movement '+r.dR.toFixed(0)+' mm at the terminal point.',
          'Check the chamber, above-ground connection or compensator can take this. A single E-comp absorbs up to about 150 mm.',
          'EN 13941',{k:'node',id:n.id});
    }

    /* --- tees and branches -------------------------------------------- */
    if(role==='tee'){
      const scf=SCFS[n.teeType||M.design.teeType]||SCFS.plain;
      const S=secOf(n.id);
      const x=S?posIn(S,n.id):null;
      const mv=(S&&x!==null)?moveAt(S,x):{d:0,dir:0};
      /* run direction at the tee */
      let runDir={x:1,y:0}, runEdges=[];
      if(S){
        let cur=S.n0;
        for(const e of S.edges){const nxt=other(e,cur);
          if(cur===n.id||nxt===n.id)runEdges.push(e); cur=nxt;}
        if(runEdges.length){const e=runEdges[0];const u=dirFrom(e,e.a);runDir=u;}
      }
      const dTee=mv.d, sgn=mv.dir||1;
      const mvVec={x:runDir.x*dTee*sgn,y:runDir.y*dTee*sgn};
      r.teeMove=dTee; r.teeVec=mvVec; r.teeScf=scf;
      const runIds=new Set(runEdges.map(e=>e.id));
      const brs=es.filter(e=>!runIds.has(e.id));

      const dsRun=scf.run*dsLocal;
      const teeRow={n:n.id,move:dTee,sig:r.sig,dsRun,util:dsRun/A.dsFat,br:[],scf:scf.name};
      if(dsRun>A.dsFat)
        push('high','TEE-1','Tee run stress exceeds fatigue allowable — reinforcement required',
          'Stress range in the run pipe at the branch intersection '+dsRun.toFixed(0)+
          ' MPa (SCF '+scf.run+', '+scf.name.toLowerCase()+') against '+A.dsFat.toFixed(0)+
          ' MPa allowable for '+A.N+' cycles.',
          'Use a reinforced or forged tee, add a reinforcing saddle / full-encirclement pad, or reduce the axial stress level at this location with an expansion element.',
          'EN 13941 branch connections',{k:'node',id:n.id});
      else if(dsRun>0.85*A.dsFat)
        push('watch','TEE-2','Tee run stress close to the fatigue allowable',
          dsRun.toFixed(0)+' MPa against '+A.dsFat.toFixed(0)+' MPa ('+
          (100*dsRun/A.dsFat).toFixed(0)+'% utilisation).',
          'Consider upgrading the branch detail or confirming with a detailed model.',
          'EN 13941 branch connections',{k:'node',id:n.id});

      brs.forEach(be=>{
        const bp=edgeProps(be);
        const ub=dirFrom(be,n.id);
        const along=mvVec.x*ub.x+mvVec.y*ub.y;
        const lat=Math.hypot(mvVec.x-along*ub.x,mvVec.y-along*ub.y);
        const bS=sections.find(S2=>S2.edges.includes(be)&&(S2.n0===n.id||S2.n1===n.id));
        const Lb=bS?bS.L:edgeLen(be);
        const sigB=bS?bS.sig:0;
        const dsB=th.sigMax>0?(sigB/th.sigMax)*th.dSig:0;
        const Lreq=lat>0.5?Math.sqrt(3*th.E*bp.d*lat*scf.br/A.dsFat)/1000:0;
        const sigBend=Lb>0?3*th.E*bp.d*lat/Math.pow(Lb*1000,2):0;
        const dsBr=scf.br*(dsB+sigBend);
        const padL=Math.max(Lreq,padZone(bp.d,lat));
        const row={e:be.id,dn:be.dn,lat,along,Lb,Lreq,sigBend,dsBr,util:dsBr/A.dsFat,padL,
          layers:padLayers(lat)};
        teeRow.br.push(row); branchReport.push(Object.assign({n:n.id},row));
        ER[be.id].branchLat=lat; ER[be.id].branchLreq=Lreq;

        if(Lreq>0&&Lb<Lreq)
          push('critical','BR-1','Branch too rigid for the main-pipe movement',
            'DN'+be.dn+' branch has only '+Lb.toFixed(1)+
            ' m of free length before its next fixed point or bend, against '+Lreq.toFixed(1)+
            ' m required to absorb '+lat.toFixed(0)+
            ' mm of lateral movement of the main. Bending stress range would be '+
            sigBend.toFixed(0)+' MPa.',
            'Introduce a bend (L-leg) in the branch at least '+Lreq.toFixed(1)+
            ' m from the tee, run the branch parallel to the main before turning off, or use a swept / parallel branch detail. Pads over '+
            padL.toFixed(1)+' m each side of the branch.',
            'Guided-cantilever flexibility',{k:'edge',id:be.id});
        else if(Lreq>0&&Lb<1.3*Lreq)
          push('watch','BR-2','Branch flexibility is marginal',
            'Free length '+Lb.toFixed(1)+' m against '+Lreq.toFixed(1)+' m required ('+
            (100*Lreq/Lb).toFixed(0)+'% utilised).',
            'Add foam pads over '+padL.toFixed(1)+
            ' m along both sides of the branch, or move the first branch bend further from the tee.',
            'Guided-cantilever flexibility',{k:'edge',id:be.id});
        if(dsBr>A.dsFat)
          push('high','BR-3','Branch intersection stress exceeds fatigue allowable',
            'Combined axial + bending stress range in the branch '+dsBr.toFixed(0)+
            ' MPa (SCF '+scf.br+') against '+A.dsFat.toFixed(0)+' MPa.',
            'Reinforce the branch connection and increase the branch flexible length.',
            'EN 13941 branch connections',{k:'edge',id:be.id});
        if(lat>5&&padLayers(lat)>0)
          push('info','BR-4','Foam pads required along branch',
            lat.toFixed(0)+' mm lateral movement imposed on the DN'+be.dn+' branch.',
            'Provide '+padLayers(lat)+' x 40 mm pad layer(s) over '+padL.toFixed(1)+
            ' m from the tee, both sides of the branch.','LOGSTOR branch detail',{k:'edge',id:be.id});

        /* BR-5: maximum straight length before first bend -------------------
           The branch acts as a separate bonded run. The maximum straight
           length between its tee (a fixed or semi-fixed end) and a bend or
           anchor is governed by the same L(all) formula as the main pipe.
           LOGSTOR quotes Lall = sigma_all * As / F for the branch pipe.
           Exceeding Lall means stress in the branch can reach sigAll since
           the tee end acts as a semi-constrained point (one-end limit, not 2×Lall).
           would exceed sigma_all even with expansion at both ends, so a
           bend is needed at or before Lall from the tee.                  */
        const bLall=A.sigAll*bp.As/Math.max(bp.F*1000,0.01);
        ER[be.id].branchLall=bLall;
        const bStraight=bS?bS.L:edgeLen(be);   /* free straight from tee to first bend/end */
        /* For a branch, the tee end is semi-constrained (moves with the main but
           cannot expand freely). The effective limit is Lall (one constrained end),
           not 2×Lall which applies only to a run with free ends at both sides.     */
        if(bStraight>bLall)
          push('high','BR-5','Branch straight length exceeds installation length L(all)',
            'DN'+be.dn+' branch runs '+bStraight.toFixed(1)+
            ' m straight from the tee to its first bend or free end. '+
            'The maximum for this pipe and soil is L(all) = '+bLall.toFixed(1)+
            ' m — beyond this, axial stress in the branch can exceed \u03c3all = '+
            A.sigAll.toFixed(0)+' MPa.',
            'Add a bend within '+bLall.toFixed(1)+
            ' m of the tee, or anchor the branch at that point, to allow thermal stress relief.',
            'EN 13941 / LOGSTOR Lall',{k:'edge',id:be.id});
        else if(bStraight>0.75*bLall)
          push('watch','BR-6','Branch straight length is approaching L(all)',
            'DN'+be.dn+' branch is '+bStraight.toFixed(1)+
            ' m straight (L(all) = '+bLall.toFixed(1)+' m, '+
            (100*bStraight/bLall).toFixed(0)+'% of limit).',
            'Consider adding a bend within '+bLall.toFixed(1)+' m of the tee.',
            'EN 13941 / LOGSTOR Lall',{k:'edge',id:be.id});
      });
      teeReport.push(teeRow);
      if(dTee>3)
        push('info','TEE-3','Main pipe moves '+dTee.toFixed(0)+' mm at this branch',
          'Axial movement of the run pipe is imposed on the branch as lateral displacement.',
          'Confirm the branch detail and pad arrangement suit this movement.',
          'LOGSTOR expansion at branches',{k:'node',id:n.id});
    }
  }


  /* ===== MULTI-BEND ELEMENTS: carry the delivered movement through =====
     The section model gives each short leg only its own thermal movement,
     so the inner corners of a U-loop or offset would read as motionless.
     Group expansion bends joined by legs that are short against their own
     friction length, and size every pad in the group on the largest
     movement delivered to it. Approximate, and flagged as such.        */
  {
    const seenG=new Set(), groups=[];
    const isBend=x=>x&&x.ep&&!x.fixed&&/bend|loop|ecomp/.test(x.role);
    for(const nid in NR){
      if(seenG.has(nid)||!isBend(NR[nid]))continue;
      const grp=[],stack=[nid];
      while(stack.length){
        const c2=stack.pop(); if(seenG.has(c2))continue;
        seenG.add(c2); grp.push(c2);
        sections.forEach(S=>{
          if(S.n0!==c2&&S.n1!==c2)return;
          const o=(S.n0===c2)?S.n1:S.n0;
          if(!isBend(NR[o])||seenG.has(o))return;
          if(S.L<0.5*S.LF)stack.push(o);
        });
      }
      if(grp.length>1)groups.push(grp);
    }
    groups.forEach(g=>{
      const dMax=Math.max(...g.map(x=>NR[x].dR||0));
      if(dMax<=5)return;
      let touched=0;
      g.forEach(x=>{
        const r2=NR[x]; if(!r2.pad)return;
        let ch=false;
        r2.pad.legs.forEach(L=>{
          if(L.d<dMax-0.5){L.d=dMax;
            L.F=padZone(pipeByDn(M.edges[L.e].dn).d,dMax);ch=true;}
        });
        if(!ch)return;
        touched++;
        r2.pad.F=Math.max(...r2.pad.legs.map(l=>l.F));
        r2.pad.dR=Math.max(r2.pad.dR,dMax);
        r2.pad.layers=Math.max(r2.pad.layers,padLayers(dMax));
        r2.pad.t=r2.pad.layers*PAD.layer;
        r2.pad.trench=(r2.pad.maxDc+2*r2.pad.t+2*(M.soil.workAllow||0))/1000;
        r2.pad.lengths=[r2.pad.F,r2.pad.F/2,r2.pad.F/4]
          .slice(0,Math.max(1,Math.min(3,r2.pad.layers)));
        r2.pad.approx=true;
      });
      if(touched)
        push('watch','LOOP-1','Multi-bend expansion element modelled approximately',
          'The '+g.length+' bends here are joined by legs that are short against their own '+
          'friction length, so they act as one expansion element rather than independent bends. '+
          'Every pad in the group has been sized on the '+dMax.toFixed(0)+
          ' mm delivered to it, because the section model does not carry displacement through '+
          'a chain of bends.',
          'Treat the pad quantities here as indicative and confirm the element against the '+
          'supplier loop or offset tables, or model it explicitly.',
          'Tool limitation',{k:'node',id:g[0]});
    });
    /* refresh the reported fit now that pad zones may have grown */
    R_bendSync();
  }

  /* ===== PAD SIZING FINDINGS (after propagation) ===================== */
  for(const n of Object.values(M.nodes)){
    const r=NR[n.id]; if(!r||!r.pad)continue;
    const layers=r.pad.layers, legs=r.pad.legs, Fmax=r.pad.F, trench=r.pad.trench;

      /* --- PAD-1: does the pad zone physically fit? --------------------- */
    if(layers>0)legs.forEach(L=>{
      if(L.F<=0.05)return;
      if(L.F>L.avail+0.05){
        const meets={bend:'another bend',tee:'a branch',anchor:'a fixed point',
          reducer:'a reducer',valve:'a valve',ecomp:'an E-comp',loop:'a U-loop',
          free:'the pipe end',end:'the pipe end'}[L.endRole]||'the next feature';
        push('high','PAD-1','Pad zone does not fit on this leg',
          'The '+L.F.toFixed(1)+' m pad zone on the DN'+L.dn+
          ' leg runs past '+meets+' at '+L.avail.toFixed(1)+
          ' m. Only '+L.avail.toFixed(1)+' m of clear straight pipe is available.',
          'Lengthen the leg to at least '+L.F.toFixed(1)+
          ' m, reduce the movement at this bend (shorter section, pre-stress, or a U-loop), or ask the supplier for a shortened pad arrangement. Pads must not be laid through a mitred weld or a fitting.',
          'LOGSTOR F-length / pad layout',{k:'node',id:n.id});
      } else if(L.F>0.85*L.avail){
        push('watch','PAD-2','Pad zone nearly fills the available leg',
          L.F.toFixed(1)+' m of pads on a '+L.avail.toFixed(1)+' m clear length ('+
          (100*L.F/L.avail).toFixed(0)+'%).',
          'Check the layout on the trench drawing before it is issued; there is little room for the leg to be shortened on site.',
          'LOGSTOR F-length',{k:'node',id:n.id});
      }
    });

    /* --- PAD-4: excavation width and adjacent pipe clearance ---------- */
    if(layers>0){
      if(M.soil.trenchMax>0&&trench>M.soil.trenchMax+0.005)
        push('watch','PAD-4','Excavation width exceeded at this bend',
          'Casing \u00f8'+r.pad.maxDc+' mm plus '+r.pad.t+' mm of pad each side plus '+
          (M.soil.workAllow||0)+' mm working space needs a '+trench.toFixed(2)+
          ' m trench, against the '+M.soil.trenchMax.toFixed(2)+' m stated maximum.',
          'Widen the excavation locally, reduce the pad thickness by shortening the expansion section, or move the bend to where the trench can be opened out.',
          'EN 13941-2 trench',{k:'node',id:n.id});
      if(M.soil.pairGap>0&&r.pad.t>M.soil.pairGap)
        push('watch','PAD-5','Pads will not fit the gap to the adjacent pipe',
          r.pad.t+' mm of pad against a stated clear gap of '+M.soil.pairGap+
          ' mm between adjacent casings.',
          'Increase the casing spacing locally at the bend, or fit pads on the outer face only and confirm the one-sided arrangement with the supplier.',
          'EN 13941-2 casing spacing',{k:'node',id:n.id});
    }
    if(layers>PAD.maxLayers)
      push('high','EXP-1','Expansion at bend exceeds foam-pad capacity',
        'Resultant movement '+r.dR.toFixed(0)+' mm needs '+layers+
        ' x 40 mm pad layers. Manufacturer guidance caps normal design at 3 layers (120 mm, i.e. 84 mm movement) so casing surface temperature stays within EN 13941 limits.',
        'Reduce the section length between expansion points, pre-stress (heat or E-comp), or replace the L-bend with a U-loop. Otherwise refer the detail to the pipe supplier.',
        'EN 13941 / pad system',{k:'node',id:n.id});
    else if(layers>0&&r.dR>5)
      push('info','EXP-0','Foam pads required at bend',
        'Resultant movement '+r.dR.toFixed(0)+' mm. Provide '+layers+' x 40 mm pad layer(s) over F = '+
        Fmax.toFixed(1)+' m on the outside of the bend, layers stepped F / F-2 / F-4.',
        'Show pad lengths on the trench drawing. Each leg is padded over its own F, set by the movement arriving across that leg.',
        'LOGSTOR F-length',{k:'node',id:n.id});
  }

  /* ============ Z-BEND AND LOOP LEG DIMENSION (0.45 rule) ============= */
  for(const nid in NR){
    const r=NR[nid]; if(!r.pad||!r.pad.layers)continue;
    r.pad.legs.forEach(L=>{
      const rr=NR[L.end];
      if(!rr||!rr.pad||!rr.pad.layers)return;
      if(nid>=L.end)return;                       /* once per pair */
      const far=rr.pad.legs.find(x=>x.end===nid);
      const F2=far?far.F:rr.pad.F;
      const need=0.45*(L.F+F2);
      if(need<=0.05)return;
      /* Z offset (outer legs run opposite ways) or U-loop crown (same way) */
      const oa=otherEdge(nid,L.e), ob=otherEdge(L.end,L.lastEdge);
      let isZ=true;
      if(oa&&ob){const ua=dirFrom(oa,nid), ub=dirFrom(ob,L.end);
        isZ=(ua.x*ub.x+ua.y*ub.y)<0;}
      r.pad.zNeed=need; r.pad.zHave=L.avail;
      if(L.avail<need-0.05)
        push('high','PAD-3',(isZ?'Z-offset':'Loop leg')+' is shorter than the pads need',
          'The leg between the two expansion bends is '+L.avail.toFixed(1)+
          ' m. With '+L.F.toFixed(1)+' m and '+F2.toFixed(1)+
          ' m pad zones either end, the manufacturer rule Z \u2265 0.45(F\u2081+F\u2082) asks for '+
          need.toFixed(1)+' m.'+(isZ?'':
          ' The 0.45 rule is written for Z offsets; for a loop crown treat this as indicative and check the supplier loop tables.'),
          'Lengthen the offset to at least '+need.toFixed(1)+
          ' m, or cut the movement at the bends so the pad zones shorten.',
          'LOGSTOR Z-bend rule',{k:'node',id:nid});
    });
  }

  /* ====================== SECTION-LEVEL CHECKS ======================== */
  sections.forEach(S=>{
    const loc={k:'section',id:S.id};
    const dsSec=th.sigMax>0?(S.sig/th.sigMax)*th.dSig:0;
    S.ds=dsSec;
    if(S.sig>A.c1+0.5)
      push('critical','C1-1','Local stability limit exceeded',
        'Axial stress '+S.sig.toFixed(0)+' MPa exceeds the EN 13941 limit-state C1 value of '+
        A.c1.toFixed(0)+' MPa for a '+S.maxD.toFixed(1)+
        ' mm service pipe. Risk of local buckling / folding of the pipe wall.',
        'Reduce the temperature difference, pre-stress the section, or insert expansion elements so the axial stress falls below '+
        A.c1.toFixed(0)+' MPa. Larger diameters may need a heavier wall.',
        'EN 13941 limit state C1',loc);
    else if(S.sig>A.sigAll+0.5){
      const nSec=Math.ceil(S.L/(2*S.Lall));
      push('high','STR-1','Axial stress above the adopted design level',
        'Section '+S.id+' reaches '+S.sig.toFixed(0)+' MPa against the adopted '+
        A.sigAll.toFixed(0)+' MPa. Section length '+S.L.toFixed(0)+
        ' m, friction length LF '+S.LF.toFixed(0)+' m, L(all) '+S.Lall.toFixed(0)+' m.',
        'Divide the section with '+(nSec-1)+' expansion element(s) (L, Z or U) at not more than '+
        (2*S.Lall).toFixed(0)+' m spacing, or pre-stress it. Alternatively accept the higher level if global stability is demonstrated (C1 limit is '+
        A.c1.toFixed(0)+' MPa).',
        'EN 13941 / installation length',loc);
    }
    if(S.e0==='free'&&S.e1==='free'&&S.L>2*S.Lall&&S.sig<=A.sigAll+0.5){}
    if(S.lock>0&&S.sig<=A.sigAll+0.5)
      push('info','STR-2','Fully restrained length '+S.lock.toFixed(0)+' m',
        'Section '+S.id+' is '+S.L.toFixed(0)+' m long with '+S.LF.toFixed(0)+
        ' m friction length at each end. The centre '+S.lock.toFixed(0)+
        ' m does not move; axial stress there is '+S.sig.toFixed(0)+' MPa.',
        'Excavated material may be reused as backfill in the locked zone. Restrict later parallel excavation: max free length about '+
        (0.0248*S.maxD*190/Math.max(S.sig,1)).toFixed(1)+' m at this stress.',
        'EN 13941 / global stability',loc);
    if(S.mixed)
      push('watch','SEC-1','Mixed diameters within one expansion section',
        'Section '+S.id+' contains more than one DN. Friction, area and stress have been length-weighted.',
        'Check the reducer separately: EN 13941 requires forces and moments at reducers to be analysed, and stress concentration at the transition is typically 1.5.',
        'EN 13941 reducers',loc);
    /* cover checks per edge */
    S.edges.forEach(e=>{
      const p=edgeProps(e), cov=p.cover;
      const hm=HMAX[p.p.d]?HMAX[p.p.d][p.series-1]:null;
      if(cov<0.4)
        push('watch','COV-1','Soil cover below the recommended minimum',
          'Cover '+cov.toFixed(2)+' m over the casing on this length.',
          'Provide at least 0.4 m under roads and 0.5 m in unpaved areas, or protect the pipes with a reinforced concrete or steel plate.',
          'EN 13941 / trench',{k:'edge',id:e.id});
      if(hm&&cov>hm)
        push('watch','COV-2','Soil cover above the manufacturer maximum',
          'Cover '+cov.toFixed(2)+' m exceeds the '+hm.toFixed(2)+
          ' m maximum for DN'+e.dn+' series '+p.series+', which keeps the shear stress transferred through the foam within EN 253/13941 limits.',
          'Reduce the depth, increase the insulation series, or agree the deeper installation with the supplier (usually acceptable inside a fully locked zone).',
          'Manufacturer max cover',{k:'edge',id:e.id});
    });
  });

  /* ====================== NETWORK-LEVEL NOTES ========================= */
  if(M.ops.install!=='cold'){
    const need=M.ops.Tins+A.sigAll/th.Ea;
    if(M.ops.install==='ecomp'&&M.ops.Tpre<need-0.5)
      push('watch','PRE-1','Pre-stress temperature is below the level the E-comps need',
        'To close the compensators at '+A.sigAll.toFixed(0)+' MPa the pre-stress temperature must reach '+
        need.toFixed(0)+' \u00b0C; '+M.ops.Tpre.toFixed(0)+' \u00b0C is set.',
        'Raise the pre-heat temperature or reduce the spacing between E-comps.',
        'Manufacturer E-comp rule',{k:'global'});
    push('info','PRE-0','Pre-stressed installation assumed',
      'Reference (stress-free) temperature '+th.Tref.toFixed(0)+' \u00b0C. Compressive stress '+
      th.sigC.toFixed(0)+' MPa at Tmax, tensile '+th.sigT.toFixed(0)+' MPa at Tmin.',
      'The fatigue stress range is unchanged by pre-stressing: bends and branches still see the full '+
      th.dSig.toFixed(0)+' MPa range. Watch the tensile case, which pipes tolerate less well.',
      'EN 13941 pre-stressing',{k:'global'});
  }
  if(th.sigT>A.sigAll+0.5)
    push('watch','TEN-1','Tensile stress on cooling exceeds the design level',
      'Cooling from '+th.Tref.toFixed(0)+' to '+M.ops.Tmin.toFixed(0)+' \u00b0C gives '+
      th.sigT.toFixed(0)+' MPa tension.',
      'Tension is more onerous than compression for welds and branches. Reconsider the reference temperature or the minimum design temperature.',
      'EN 13941',{k:'global'});
  if(!Object.keys(M.edges).length)
    push('info','MOD-0','Nothing drawn yet','Sketch a route to start the analysis.',
      'Use the Route tool, or load a template.','',{k:'global'});

  /* ============================ SUMMARY =============================== */
  let totLen=0,maxUtil=0,maxSig=0,maxMove=0;
  for(const e of Object.values(M.edges)){const r=ER[e.id];totLen+=r.len;
    maxUtil=Math.max(maxUtil,r.util);maxSig=Math.max(maxSig,r.sigMax);}
  for(const nid in NR)maxMove=Math.max(maxMove,NR[nid].dR||0);
  const tally={critical:0,high:0,watch:0,info:0};
  F.forEach(f=>tally[f.sev]++);
  const order={critical:0,high:1,watch:2,info:3};
  F.sort((a,b)=>order[a.sev]-order[b.sev]);
  F.forEach((f,i)=>f.id='F'+(i+1));

  buildRefs(NR,ER);
  return{ok:true,A,th,sections,NR,ER,runs,findings:F,tally,
    teeReport,bendReport,branchReport,
    summary:{totLen,maxUtil,maxSig,maxMove,nSec:sections.length,
      nNodes:Object.keys(M.nodes).length,nEdges:Object.keys(M.edges).length,
      cls:A.cls,sigAll:A.sigAll,c1:A.c1,dsFat:A.dsFat,N:A.N}};
}

function buildRefs(NR,ER){
  REF={};
  let j=0,ps=0,fp=0;
  for(const id in ER) REF[id]='PS-'+(++ps).toString().padStart(3,'0');
  const ordered=[...Object.keys(NR)].sort((a,b)=>{
    const rank=r=>r==='tee'?0:r==='anchor'?1:r==='bend'?2:r==='free'?3:4;
    return rank(NR[a].role)-rank(NR[b].role);
  });
  for(const id of ordered){
    const r=NR[id]; if(r.role==='weld'||r.role==='orphan')continue;
    REF[id]='J-'+(++j).toString().padStart(3,'0');
  }
  for(const id of ordered){
    const r=NR[id]; if(!r.pad||!r.pad.layers)continue;
    REF[id+'_fp']='FP-'+(++fp).toString().padStart(3,'0');
  }
}

/* ============================ 4. VIEW / RENDER ========================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let V={sc:6,tx:0,ty:0,w:0,h:0,dpr:1};
let mouse={x:0,y:0,wx:0,wy:0,down:false};
let draw={active:false,pts:[],lastNode:null,preview:null,snap:null,branchDir:null};
let tool='route';

const W2S=(x,y)=>({x:x*V.sc+V.tx,y:y*V.sc+V.ty});
const S2W=(x,y)=>({x:(x-V.tx)/V.sc,y:(y-V.ty)/V.sc});


function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  V.dpr=window.devicePixelRatio||1; V.w=r.width; V.h=r.height;
  cv.width=r.width*V.dpr; cv.height=r.height*V.dpr;
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  ctx.setTransform(V.dpr,0,0,V.dpr,0,0);
  render();
}
function fit(){
  const ns=Object.values(M.nodes);
  if(!ns.length){V.sc=6;V.tx=V.w/2;V.ty=V.h/2;render();return;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ns.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);});
  const pad=70, bw=Math.max(x1-x0,5), bh=Math.max(y1-y0,5);
  V.sc=Math.min((V.w-2*pad)/bw,(V.h-2*pad)/bh);
  V.sc=Math.max(.05,Math.min(V.sc,60));
  V.tx=V.w/2-(x0+x1)/2*V.sc; V.ty=V.h/2-(y0+y1)/2*V.sc;
  render();
}

/* colour ramp -----------------------------------------------------------*/
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);
  return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';};
function ramp(u){
  const st=[[0,'#3f8a2e'],[0.5,'#7c9a1f'],[0.75,'#a8790a'],[0.9,'#c1531c'],[1,'#c1291f']];
  if(u>=1)return u>1.25?'#8f1f17':'#c1291f';
  for(let i=1;i<st.length;i++)
    if(u<=st[i][0])return mix(st[i-1][1],st[i][1],(u-st[i-1][0])/(st[i][0]-st[i-1][0]));
  return '#c1291f';
}
const SEVC={critical:'#8f1f17',high:'#c1531c',watch:'#a8790a',info:'#8a9600'};
const INK='#111111', INKLIME='#8a9600';

function niceStep(px){
  const cand=[0.5,1,2,5,10,20,25,50,100,200,500,1000,2000];
  for(const c of cand)if(c*V.sc>=px)return c;
  return 5000;
}


function render(){
  ctx.clearRect(0,0,V.w,V.h);
  ctx.fillStyle='#f5f5f1'; ctx.fillRect(0,0,V.w,V.h);
  if(M.view.grid)drawGrid();
  const vw=M.view.show;

  /* pads first (under pipes) */
  if(M.view.pads&&R)drawPads();

  /* edges */
  for(const e of Object.values(M.edges)){
    const A=M.nodes[e.a],B=M.nodes[e.b];if(!A||!B)continue;
    const a=W2S(A.x,A.y),b=W2S(B.x,B.y);
    const pr=edgeProps(e);
    const casW=Math.max(5,Math.min(30,pr.Dc/1000*V.sc));
    const stW=Math.max(2.6,Math.min(18,pr.d/1000*V.sc));
    const r=R?R.ER[e.id]:null;
    /* casing */
    ctx.strokeStyle='#1a1a17';ctx.lineWidth=casW+2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.strokeStyle='#d7d7d0';ctx.lineWidth=casW;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    /* service pipe */
    let col='#3a3a34';
    if(vw==='stress'&&r){
      /* Use sigAt() to sample the stress profile across this specific edge.
         For a free/free section the peak is in the middle, not at the ends,
         so a simple endpoint gradient would show green everywhere.
         Sample at ~7 points and build a proper gradient.                */
      const S=R.sections.find(sc=>sc.id===r.sec);
      if(S&&S.sigAt&&(r.sigA!==r.sigB||r.sigA<r.sigMax-1)){
        const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
        const steps=6;
        for(let i=0;i<=steps;i++){
          const t=i/steps;
          const xSec=r.x0+(r.x1-r.x0)*t;  /* x within section */
          const sig=S.sigAt(xSec);
          g.addColorStop(t,ramp(sig/(R.A.sigAll||1)));
        }
        ctx.strokeStyle=g;
      } else {
        const g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
        g.addColorStop(0,ramp(r.sigA/(R.A.sigAll||1)));
        g.addColorStop(1,ramp(r.sigB/(R.A.sigAll||1)));
        ctx.strokeStyle=g;
      }
    } else if(vw==='dn'){
      const t=Math.min(1,(e.dn-20)/580); ctx.strokeStyle=mix('#d6d6cc','#12140a',t);
    } else if(vw==='util'&&r){ctx.strokeStyle=ramp(r.util);}
    else ctx.strokeStyle=col;
    ctx.lineWidth=Math.max(2,stW);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();

    /* BR-5 / BR-6 overlay: dashed warning stripe on over-long branches */
    if(R&&r){
      const br5=R.findings.find(f=>(f.code==='BR-5'||f.code==='BR-6')&&f.loc&&f.loc.id===e.id);
      if(br5){
        const isCrit=br5.code==='BR-5';
        ctx.save();
        ctx.setLineDash(isCrit?[5,4]:[8,6]);
        ctx.strokeStyle=isCrit?'#c1291f':'#c1531c';
        ctx.lineWidth=Math.max(1.8, stW*0.45);
        ctx.globalAlpha=isCrit?0.85:0.65;
        ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha=1;
        ctx.restore();
      }
    }

    /* selection / hover */
    if((sel.kind==='edge'&&sel.id===e.id)||(hover.kind==='edge'&&hover.id===e.id)){
      ctx.strokeStyle=sel.id===e.id?'#c4d600':'#c4d60088';
      ctx.lineWidth=casW+6;ctx.globalAlpha=.32;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1;
    }
    /* labels */
    if(M.view.labels&&V.sc>2.2){
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      let ang=Math.atan2(b.y-a.y,b.x-a.x);
      if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
      ctx.save();ctx.translate(mx,my);ctx.rotate(ang);
      ctx.font='500 9px "Consolas","Segoe UI Mono",monospace';ctx.textAlign='center';
      const ref=(R&&REF[e.id])?REF[e.id]+' ':'';
      const txt=ref+'DN'+e.dn+'/S'+(e.series||2)+'  '+edgeLen(e).toFixed(1)+' m';
      const tw=ctx.measureText(txt).width;
      ctx.fillStyle='rgba(255,255,255,.86)';ctx.fillRect(-tw/2-4,-casW/2-15,tw+8,13);
      ctx.fillStyle='#54544e';ctx.fillText(txt,0,-casW/2-5);
      /* BR-5/6 Lall% warning label — shown below the pipe DN label */
      if(R&&r){
        const brFind=R.findings.find(f=>(f.code==='BR-5'||f.code==='BR-6')&&f.loc&&f.loc.id===e.id);
        if(brFind&&r.branchLall){
          const Lb=edgeLen(e), util=Lb/(2*r.branchLall);
          const pct=Math.round(util*100);
          const warn='branch '+(pct>100?'exceeds':'near')+' L(all) \u2014 '+pct+'%';
          ctx.font='500 9px "Consolas","Segoe UI Mono",monospace';
          const ww=ctx.measureText(warn).width;
          ctx.fillStyle=brFind.code==='BR-5'?'rgba(193,41,31,.92)':'rgba(193,83,28,.88)';
          ctx.fillRect(-ww/2-4,casW/2+3,ww+8,12);
          ctx.fillStyle='#ffffff';ctx.fillText(warn,0,casW/2+12);
        }
      }
      ctx.restore();
    }
  }

  /* section boundary ticks */
  if(R){
    R.sections.forEach(S=>{
      [S.n0,S.n1].forEach(nid=>{const n=M.nodes[nid];if(!n)return;});
    });
  }

  if(!Object.keys(M.edges).length&&!draw.active){
    ctx.textAlign='center';
    ctx.fillStyle='#6d6d63';ctx.font='600 15px system-ui,sans-serif';
    ctx.fillText('Sketch a route to begin',V.w/2,V.h/2-14);
    ctx.fillStyle='#9a9a90';ctx.font='400 12px system-ui,sans-serif';
    ctx.fillText('Press R and click to place points \u00b7 Shift locks to 90\u00b0 \u00b7 Enter finishes',
      V.w/2,V.h/2+8);
    ctx.fillText('load a template from the top bar, or open the Guide for the full tool reference',
      V.w/2,V.h/2+26);
  }

  /* nodes */
  for(const n of Object.values(M.nodes))drawNode(n);

  /* bend angles */
  if(M.view.angles&&V.sc>1.2)drawAngles();

  /* movement arrows */
  if(M.view.moves&&R)drawMoves();

  /* finding badges */
  if(R)drawBadges();
  /* badge callout tooltip */
  if(badgeHover.g){
    const list=badgeHover.g.list, px=badgeHover.px, py=badgeHover.py;
    const maxW=340, lh=16, pad=11;
    const innerW=maxW-pad*2;

    /* measure-aware word wrap — uses actual canvas glyph widths */
    const wrapText=(text,font,maxPx)=>{
      ctx.font=font;
      const words=text.split(' ');
      const wrapped=[]; let line='';
      words.forEach(w=>{
        const test=line?line+' '+w:w;
        if(ctx.measureText(test).width>maxPx&&line){wrapped.push(line);line=w;}
        else line=test;
      });
      if(line)wrapped.push(line);
      return wrapped;
    };

    const boldFont='600 10.5px "Segoe UI",system-ui,sans-serif';
    const bodyFont='400 10px "Segoe UI",system-ui,sans-serif';
    const dimFont='400 9.5px "Segoe UI",system-ui,sans-serif';

    const lines=[];
    list.forEach(f=>{
      /* title line — may also wrap */
      const titleLines=wrapText(f.code+' \u2014 '+f.title, boldFont, innerW);
      titleLines.forEach((t,i)=>lines.push({bold:true,col:SEVC[f.sev],txt:t,first:i===0}));
      /* detail — wrap using body font */
      const detail=f.detail.replace(/<[^>]+>/g,'');
      wrapText(detail, bodyFont, innerW).forEach(t=>lines.push({txt:t}));
      /* fix — wrap using dim font */
      if(f.fix){
        const fixTxt='\u2192 '+f.fix.replace(/<[^>]+>/g,'');
        wrapText(fixTxt, dimFont, innerW).forEach(t=>lines.push({txt:t,dim:true}));
      }
      lines.push({sep:true});
    });
    while(lines.length&&lines[lines.length-1].sep)lines.pop();

    const footerH=14;
    const h=lines.length*lh+pad*2+footerH;
    let cx=px+20, cy=py-h/2;
    if(cx+maxW>V.w-8)cx=px-maxW-20;
    if(cy<8)cy=8; if(cy+h>V.h-8)cy=V.h-h-8;

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
    ctx.fillStyle='#111111';
    roundRect(ctx,cx,cy,maxW,h,6);ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#3a3a30';ctx.lineWidth=1;
    roundRect(ctx,cx,cy,maxW,h,6);ctx.stroke();

    let y=cy+pad+11;
    lines.forEach(l=>{
      if(l.sep){
        ctx.strokeStyle='#2a2a24';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(cx+8,y+2);ctx.lineTo(cx+maxW-8,y+2);ctx.stroke();
        y+=9;return;
      }
      ctx.fillStyle=l.col||(l.dim?'#8a8a78':'#e0e0d4');
      ctx.font=l.bold?boldFont:(l.dim?dimFont:bodyFont);
      ctx.textAlign='left';
      ctx.fillText(l.txt,cx+pad,y);
      y+=lh;
    });
    ctx.fillStyle='#5a5a52';
    ctx.font='8px "Consolas","Segoe UI Mono",monospace';
    ctx.textAlign='center';
    ctx.fillText('click to open in findings',cx+maxW/2,cy+h-4);
  }

  /* live drawing preview */
  if(draw.active&&draw.lastNode&&draw.preview){
    const A=M.nodes[draw.lastNode],a=W2S(A.x,A.y),b=W2S(draw.preview.x,draw.preview.y);
    ctx.setLineDash([6,5]);ctx.strokeStyle='#8a9600';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#12140a';
    ctx.beginPath();ctx.arc(b.x,b.y,3.2,0,7);ctx.fill();
    const L=Math.hypot(draw.preview.x-A.x,draw.preview.y-A.y);
    const ang=(Math.atan2(draw.preview.y-A.y,draw.preview.x-A.x)*180/Math.PI+360)%360;
    const txt=L.toFixed(1)+' m   '+ang.toFixed(0)+'\u00b0';
    ctx.font='700 11px "Consolas","Segoe UI Mono",monospace';ctx.textAlign='left';
    const tw=ctx.measureText(txt).width;
    ctx.fillStyle='#12140a';ctx.fillRect(b.x+9,b.y-27,tw+12,18);
    ctx.fillStyle='#c4d600';ctx.fillText(txt,b.x+15,b.y-14);
  }
  if(draw.snap){
    const s=W2S(draw.snap.x,draw.snap.y);
    ctx.strokeStyle='#111111';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(s.x,s.y,9,0,7);ctx.stroke();
  }
  drawHud();
}

function drawGrid(){
  const step=niceStep(58), s=step*V.sc;
  const x0=Math.floor(-V.tx/s)*s+V.tx, y0=Math.floor(-V.ty/s)*s+V.ty;
  ctx.lineWidth=1;
  for(let x=x0;x<V.w;x+=s){
    const wx=Math.round((x-V.tx)/V.sc);
    ctx.strokeStyle=(Math.abs(wx)<1e-6)?'#cfcfc4':'#e6e6df';
    ctx.beginPath();ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,V.h);ctx.stroke();
  }
  for(let y=y0;y<V.h;y+=s){
    const wy=Math.round((y-V.ty)/V.sc);
    ctx.strokeStyle=(Math.abs(wy)<1e-6)?'#cfcfc4':'#e6e6df';
    ctx.beginPath();ctx.moveTo(0,Math.round(y)+.5);ctx.lineTo(V.w,Math.round(y)+.5);ctx.stroke();
  }
}

function drawNode(n){
  const p=W2S(n.x,n.y), r=R?R.NR[n.id]:null;
  const role=r?r.role:nodeRole(n,{});
  const isSel=sel.kind==='node'&&sel.id===n.id;
  const isHov=hover.kind==='node'&&hover.id===n.id;
  const S=Math.max(4,Math.min(9,V.sc*0.5+3));
  ctx.lineWidth=1.8;
  if(isSel||isHov){ctx.fillStyle=isSel?'#c4d60040':'#c4d6001a';
    ctx.beginPath();ctx.arc(p.x,p.y,S+7,0,7);ctx.fill();}
  switch(role){
    case 'anchor':
      ctx.fillStyle='#12140a';ctx.strokeStyle='#ffffff';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.rect(p.x-S,p.y-S,S*2,S*2);ctx.fill();ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(p.x-S+2,p.y+S-2);ctx.lineTo(p.x+S-2,p.y-S+2);
      ctx.moveTo(p.x-S+2,p.y-S+2);ctx.lineTo(p.x+S-2,p.y+S-2);ctx.stroke();break;
    case 'tee':
      ctx.fillStyle='#c4d600';ctx.strokeStyle='#12140a';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(p.x,p.y-S-1);ctx.lineTo(p.x+S+1,p.y);
      ctx.lineTo(p.x,p.y+S+1);ctx.lineTo(p.x-S-1,p.y);ctx.closePath();
      ctx.fill();ctx.stroke();break;
    case 'free':
      ctx.fillStyle='#f5f5f1';ctx.strokeStyle='#8a8a80';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(p.x,p.y,S*0.8,0,7);ctx.fill();ctx.stroke();break;
    case 'ecomp':
      ctx.strokeStyle='#8a9600';ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(p.x-S,p.y-S);ctx.lineTo(p.x-S,p.y+S);
      ctx.moveTo(p.x+S,p.y-S);ctx.lineTo(p.x+S,p.y+S);ctx.stroke();
      ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(p.x-S,p.y);ctx.lineTo(p.x+S,p.y);ctx.stroke();break;
    case 'loop':
      ctx.strokeStyle='#8a9600';ctx.lineWidth=2.2;
      ctx.beginPath();ctx.arc(p.x,p.y-2,S,0.6*Math.PI,2.4*Math.PI);ctx.stroke();break;
    case 'valve':{
      /* find pipe direction from any connected edge */
      const es=edgesAt(n.id);
      let ang=0;
      if(es.length){
        const e=es[0],A=M.nodes[e.a],B=M.nodes[e.b];
        /* canvas: A→B direction. atan2 uses canvas coords (Y-down) directly. */
        if(A&&B) ang=Math.atan2(W2S(B.x,B.y).y-W2S(A.x,A.y).y,
                                W2S(B.x,B.y).x-W2S(A.x,A.y).x);
      }
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
      /* bowtie: tips meet at origin, flat bases face outward along pipe */
      ctx.fillStyle='#c7c7bd';ctx.strokeStyle='#2a2a25';ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(0,0);ctx.lineTo(-S,-S);ctx.lineTo(-S,S);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0,0);ctx.lineTo(S,-S);ctx.lineTo(S,S);ctx.closePath();
      ctx.fill();ctx.stroke();
      ctx.restore();break;
    }
    case 'reducer':{
      const es=edgesAt(n.id);
      let ang=0;
      if(es.length>=2){
        /* find which edge has the larger DN — that's the wide end.
           Orient so we go from the larger-DN edge toward the smaller-DN edge. */
        const e0=es[0],e1=es[1];
        const dn0=e0.dn||100, dn1=e1.dn||100;
        /* bigEdge → node → smallEdge: direction is from bigEdge's far end through node */
        const bigEdge=dn0>=dn1?e0:e1;
        const smallEdge=dn0>=dn1?e1:e0;
        /* canvas direction: from the big-pipe side to the small-pipe side */
        const bigFar=M.nodes[other(bigEdge,n.id)];
        const smallFar=M.nodes[other(smallEdge,n.id)];
        if(bigFar&&smallFar){
          const bigS=W2S(bigFar.x,bigFar.y), smallS=W2S(smallFar.x,smallFar.y);
          /* direction big→small through node */
          ang=Math.atan2(smallS.y-bigS.y,smallS.x-bigS.x);
        }
      } else if(es.length===1){
        const e=es[0],A=M.nodes[e.a],B=M.nodes[e.b];
        if(A&&B){const aS=W2S(A.x,A.y),bS=W2S(B.x,B.y);
          ang=Math.atan2(bS.y-aS.y,bS.x-aS.x);}
      }
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(ang);
      /* trapezoid in local space: wide end on the left (-X), narrow end on right (+X)
         so after rotation the wide end faces the larger pipe */
      ctx.fillStyle='#c7c7bd';ctx.strokeStyle='#2a2a25';ctx.lineWidth=1.3;
      ctx.beginPath();
      ctx.moveTo(-S,-S*0.8);ctx.lineTo(S,-S*0.35);
      ctx.lineTo(S,S*0.35);ctx.lineTo(-S,S*0.8);
      ctx.closePath();ctx.fill();ctx.stroke();
      ctx.restore();break;
    }
    default: /* bend / weld */
      if(r&&r.ep){ctx.fillStyle='#3f8a2e';ctx.strokeStyle='#12140a';ctx.lineWidth=1.4;
        ctx.beginPath();ctx.arc(p.x,p.y,S*0.75,0,7);ctx.fill();ctx.stroke();}
      else{ctx.fillStyle='#5a5a52';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2.4,S*0.42),0,7);ctx.fill();}
  }
  if(V.sc>1.5){
    ctx.font='500 9px "Consolas","Segoe UI Mono",monospace';ctx.textAlign='center';
    const jtag=R?REF[n.id]:''; const fptag=R?REF[n.id+'_fp']:'';
    const lbl=(n.label?n.label+' ':'')+(fptag?fptag:(jtag||''));
    if(lbl){
      ctx.fillStyle='rgba(255,255,255,.82)';
      const tw2=ctx.measureText(lbl).width;
      ctx.fillRect(p.x-tw2/2-3,p.y-S-18,tw2+6,12);
      ctx.fillStyle='#22221e'; ctx.fillText(lbl,p.x,p.y-S-8);
    }
  }
}

function drawMoves(){
  ctx.font='500 9px "Consolas","Segoe UI Mono",monospace';
  for(const nid in R.NR){
    const r=R.NR[nid], n=M.nodes[nid]; if(!n)continue;
    let vx=r.move.x,vy=r.move.y,d=r.dR;
    if(r.role==='tee'&&r.teeVec){vx=r.teeVec.x;vy=r.teeVec.y;d=r.teeMove;}
    if(d<1)continue;
    const p=W2S(n.x,n.y);
    const len=Math.max(16,Math.min(58,d*0.5));
    const L=Math.hypot(vx,vy)||1, ux=vx/L, uy=vy/L;
    const q={x:p.x+ux*len,y:p.y+uy*len};
    const col=d>84?'#c1531c':'#8a9600';
    ctx.strokeStyle=col;ctx.lineWidth=1.7;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
    const a=Math.atan2(uy,ux);
    ctx.fillStyle=col;ctx.beginPath();
    ctx.moveTo(q.x,q.y);
    ctx.lineTo(q.x-8*Math.cos(a-0.38),q.y-8*Math.sin(a-0.38));
    ctx.lineTo(q.x-8*Math.cos(a+0.38),q.y-8*Math.sin(a+0.38));
    ctx.closePath();ctx.fill();
    ctx.textAlign=ux<0?'right':'left';
    ctx.fillText(d.toFixed(0)+' mm',q.x+(ux<0?-6:6),q.y+(uy<0?-4:11));
  }
}

function drawAngles(){
  ctx.font='600 9px "Consolas","Segoe UI Mono",monospace';
  ctx.textAlign='center';
  for(const n of Object.values(M.nodes)){
    const es=edgesAt(n.id); if(es.length!==2)continue;
    const d1=dirFrom(es[0],n.id), d2=dirFrom(es[1],n.id);
    const dot=Math.max(-1,Math.min(1,d1.x*d2.x+d1.y*d2.y));
    const dev=180-Math.acos(dot)*180/Math.PI;
    if(dev<2)continue;
    const pw=W2S(n.x,n.y);
    const bx=(d1.x+d2.x), by=(d1.y+d2.y);
    const bl=Math.hypot(bx,by)||1;
    const ox=-bx/bl, oy=-by/bl;
    const S=Math.max(4,Math.min(9,V.sc*0.5+3));
    const off=S+14;
    const tx=pw.x+ox*off, ty=pw.y+oy*off;
    const txt=dev.toFixed(0)+'\u00b0';
    const tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(255,255,255,.86)';
    ctx.fillRect(tx-tw/2-3,ty-9,tw+6,13);
    ctx.fillStyle='#3a3a34';
    ctx.fillText(txt,tx,ty+1);
  }
}

function drawPads(){
  ctx.save();
  for(const nid in R.NR){
    const r=R.NR[nid], n=M.nodes[nid];
    if(!r.pad||!r.pad.F||r.pad.layers<1||!n)continue;
    const p=W2S(n.x,n.y);
    edgesAt(nid).forEach(e=>{
      const u=dirFrom(e,nid);
      const Fm=r.pad.F, off=(edgeProps(e).Dc/1000*V.sc)/2+3;
      const q=W2S(n.x+u.x*Fm,n.y+u.y*Fm);
      const nx=-u.y,ny=u.x;
      const th=Math.max(3,Math.min(12,r.pad.t/1000*V.sc*2.4));
      ctx.fillStyle='rgba(196,214,0,.20)';ctx.strokeStyle='rgba(138,150,0,.55)';ctx.lineWidth=1;
      [1,-1].forEach(sgn=>{
        ctx.beginPath();
        ctx.moveTo(p.x+nx*off*sgn,p.y+ny*off*sgn);
        ctx.lineTo(q.x+nx*off*sgn,q.y+ny*off*sgn);
        ctx.lineTo(q.x+nx*(off+th)*sgn,q.y+ny*(off+th)*sgn);
        ctx.lineTo(p.x+nx*(off+th)*sgn,p.y+ny*(off+th)*sgn);
        ctx.closePath();ctx.fill();ctx.stroke();
      });
    });
  }
  ctx.restore();
}

const _badges=[];  /* [{bx,by,r,list}] — rebuilt every frame */
function drawBadges(){
  _badges.length=0;
  const at={};
  R.findings.forEach(f=>{
    if(f.sev==='info')return;
    let n=null;
    if(f.loc.k==='node')n=M.nodes[f.loc.id];
    else if(f.loc.k==='edge'){const e=M.edges[f.loc.id];
      if(e){const A=M.nodes[e.a],B=M.nodes[e.b];n={x:(A.x+B.x)/2,y:(A.y+B.y)/2};}}
    else if(f.loc.k==='section'&&R){const S=R.sections.find(s=>s.id===f.loc.id);
      if(S){const e=S.edges[Math.floor(S.edges.length/2)];const A=M.nodes[e.a],B=M.nodes[e.b];
        n={x:(A.x+B.x)/2,y:(A.y+B.y)/2};}}
    if(!n)return;
    const key=Math.round(n.x*4)+':'+Math.round(n.y*4);
    at[key]=at[key]||{x:n.x,y:n.y,list:[]}; at[key].list.push(f);
  });
  Object.values(at).forEach(g=>{
    const pw=W2S(g.x,g.y);
    const worst=g.list.reduce((a,b)=>({critical:0,high:1,watch:2,info:3}[a.sev]<=
      {critical:0,high:1,watch:2,info:3}[b.sev]?a:b));
    const sels=sel.kind==='find'&&g.list.some(f=>f.id===sel.id);
    /* place badge away from pipe segments leaving this node */
    let bx=pw.x+14, by=pw.y-14;
    const es2=edgesAt(g.x!==undefined?Object.keys(M.nodes).find(nid=>{
      const n=M.nodes[nid];return Math.abs(n.x-g.x)<0.5&&Math.abs(n.y-g.y)<0.5;})||'':'');
    if(true){ /* always compute a safe offset */
      const node=Object.values(M.nodes).find(n=>Math.abs(W2S(n.x,n.y).x-pw.x)<8&&Math.abs(W2S(n.x,n.y).y-pw.y)<8);
      if(node){
        const segs=edgesAt(node.id);
        /* sum unit vectors pointing away from node */
        let sx=0,sy=0;
        segs.forEach(e=>{const o=M.nodes[other(e,node.id)];if(!o)return;
          const L=Math.hypot(o.x-node.x,o.y-node.y)||1;
          sx+=(node.x-o.x)/L; sy+=(node.y-o.y)/L;});
        const sl=Math.hypot(sx,sy)||1; sx/=sl; sy/=sl;
        /* if the push direction is nearly zero (symmetric tee etc), default to top-right */
        if(sl<0.1){sx=0.7;sy=-0.7;}
        /* perpendicular to the principal push gives a second option; pick whichever keeps badge on screen */
        const r2=sels?9:7, off=r2+16;
        bx=pw.x+sx*off; by=pw.y+sy*off;
      }
    }
    ctx.fillStyle=SEVC[worst.sev];ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(bx,by,sels?9:7,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffffff';ctx.font='700 8.5px "Consolas","Segoe UI Mono",monospace';ctx.textAlign='center';
    ctx.fillText(g.list.length>1?String(g.list.length):'!',bx,by+3);
    /* thin line from badge to node */
    ctx.strokeStyle=SEVC[worst.sev];ctx.lineWidth=1;ctx.globalAlpha=.5;
    ctx.beginPath();ctx.moveTo(pw.x,pw.y);ctx.lineTo(bx,by);ctx.stroke();ctx.globalAlpha=1;
    _badges.push({bx,by,r:sels?9:7,list:g.list,worst});
  });
}

/* zoom presets: scale = 1/(metres per pixel) * 100  →  pixels per 100 m
   e.g. 1:1000 means 100 m = 100 px → V.sc = 1/10 = 0.1 */
const ZOOM_PRESETS=[
  {label:'1 : 5 000', mpp:50,  sc:0.002},
  {label:'1 : 2 000', mpp:20,  sc:0.005},
  {label:'1 : 1 000', mpp:10,  sc:0.01},
  {label:'1 : 500',  mpp:5,   sc:0.02},
  {label:'1 : 200',  mpp:2,   sc:0.05},
  {label:'1 : 100',  mpp:1,   sc:0.1},
  {label:'1 : 50',   mpp:0.5, sc:0.2},
  {label:'1 : 20',   mpp:0.2, sc:0.5},
  {label:'1 : 10',   mpp:0.1, sc:1.0},
];
function applyZoom(sc,cx,cy){
  cx=cx===undefined?V.w/2:cx; cy=cy===undefined?V.h/2:cy;
  const bx=S2W(cx,cy);
  V.sc=Math.max(0.001,Math.min(200,sc));
  const ax=S2W(cx,cy);
  V.tx+=(ax.x-bx.x)*V.sc; V.ty+=(ax.y-bx.y)*V.sc;
  render();
}
function setZoomPreset(sc){
  const cx=V.w/2, cy=V.h/2;
  const world=S2W(cx,cy);
  V.sc=sc;
  V.tx=cx-world.x*V.sc; V.ty=cy-world.y*V.sc;
  render();
}
function currentZoomLabel(){
  const mpp=1/V.sc; // metres per pixel
  let best=ZOOM_PRESETS[0], bd=Infinity;
  ZOOM_PRESETS.forEach(z=>{const d=Math.abs(Math.log(z.sc)-Math.log(V.sc));if(d<bd){bd=d;best=z;}});
  return bd<0.3?best.label:((1/V.sc*100).toFixed(1)+' m/100px');
}
let _hudBuilt=false;
function drawHud(){
  const step=niceStep(58);
  const tl=document.getElementById('hudTL'), br=document.getElementById('hudBR');
  if(!_hudBuilt){
    tl.innerHTML='<div class="zoomctl" id="zoomctl">'+
      '<button id="zOut" title="Zoom out (\u2212)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>'+
      '<div class="zdiv"></div>'+
      '<select id="zoomSel" title="Set a drawing scale">'+
        ZOOM_PRESETS.map(z=>'<option value="'+z.sc+'">'+z.label+'</option>').join('')+
      '</select>'+
      '<div class="zdiv"></div>'+

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
