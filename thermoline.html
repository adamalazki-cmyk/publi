<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THERMOLINE — EN 13941 route stress screening</title>
<style>
:root{
  --bg:#ffffff; --stage:#f5f5f1; --panel:#ffffff; --panel2:#f1f1ed; --panel3:#e6e6e0;
  --line:#dcdcd5; --line2:#c2c2b8; --text:#111111; --dim:#3a3a34; --dim2:#5a5a52;
  --accent:#c4d600; --accent-dk:#a6b800; --accent-ink:#12140a; --accent-text:#71790a; --violet:#12140a;
  --supply:#d6d6cc; --ret:#12140a;
  --ok:#3f8a2e; --watch:#a8790a; --high:#c1531c; --bad:#c1291f; --info:#8a9600;
  --r:4px;
  --mono:"Consolas","Segoe UI Mono",ui-monospace,Menlo,monospace;
  --sans:"Segoe UI","Segoe UI Web",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  /* Type scale — sized ~5-8% down from a literal px-for-px port of the old
     IBM-Plex-based values, since Segoe UI's x-height reads visibly larger
     at the same nominal size. Keeps overall density the same. */
  --fs-2xs:8px;   --fs-xs:8.5px;  --fs-sm:9px;    --fs-base:9.5px;
  --fs-md:10px;   --fs-lg:10.5px; --fs-xl:11px;   --fs-2xl:11.5px;
  --fs-body:12.5px; --fs-h3:13.5px; --fs-h2:17px; --fs-h1:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#9a9a8c}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:44px 1fr 24px;height:100vh}
.shell{display:grid;grid-template-columns:164px 1fr 348px;min-height:0}
.stagewrap{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--stage);border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.brand{display:flex;align-items:baseline;gap:8px;padding-right:14px;border-right:1px solid var(--line)}
.brand b{font-size:var(--fs-h3);letter-spacing:.14em;font-weight:700}
.brand span{font-family:var(--mono);font-size:var(--fs-base);color:var(--dim2);letter-spacing:.08em}
.projname{background:transparent;border:1px solid transparent;padding:4px 7px;border-radius:var(--r);width:230px;min-width:110px;flex-shrink:1;font-weight:500}
.projname:hover{border-color:var(--line2)} .projname:focus{border-color:var(--accent);background:var(--bg);outline:none}
.tbgroup{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;cursor:pointer;color:var(--dim);font-size:var(--fs-2xl);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{background:var(--panel3);color:var(--text);border-color:var(--line2)}
.tb.pri{background:var(--accent);border-color:var(--accent-dk);color:var(--accent-ink);font-weight:600}
.tb.pri:hover{background:var(--accent-dk)}
.tb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}

/* ---------- tool rail ---------- */
.rail{background:var(--panel);display:flex;flex-direction:column;gap:0;padding:6px 0 12px;overflow-y:auto;border-right:1px solid var(--line)}
.tool{width:100%;border-radius:0;background:transparent;border:none;border-left:3px solid transparent;cursor:pointer;display:flex;flex-direction:row;align-items:center;gap:9px;padding:7px 10px;color:var(--dim);position:relative;text-align:left}
.tool:hover{background:var(--panel2);color:var(--text)}
.tool.on{background:var(--text);color:var(--accent);border-left-color:var(--accent)}
.tool svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool-lbl{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.tool-lbl b{font-size:var(--fs-2xl);font-weight:600;color:inherit;white-space:nowrap}
.tool-lbl i{font-family:var(--mono);font-size:var(--fs-sm);font-style:normal;color:var(--dim2)}
.tool.on .tool-lbl i{color:rgba(196,214,0,.75)}
.railsep{height:1px;background:var(--line);margin:5px 8px}
.rail-hd{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);font-weight:700;padding:12px 12px 4px;font-family:var(--mono)}
/* tooltip suppressed — tool names now shown inline */

.dnpicker{position:absolute;z-index:40;background:#111111;border:1px solid #3a3a30;
  border-radius:6px;padding:8px;display:none;flex-direction:column;gap:6px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);pointer-events:auto;bottom:44px;left:50%;
  transform:translateX(-50%)}
.dnpicker.on{display:flex}
.dnpicker-label{font-family:"Segoe UI",system-ui,sans-serif;font-size:9px;
  color:#8a8a78;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.dnpicker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dnbtn{background:#1e1e18;border:1px solid #3a3a30;border-radius:3px;
  padding:5px 4px;cursor:pointer;font-family:"Consolas","Segoe UI Mono",monospace;
  font-size:9.5px;color:#c8c8bc;text-align:center;transition:background .1s,color .1s,border-color .1s}
.dnbtn:hover{background:#2a2a20;color:#ffffff;border-color:#5a5a42}
.dnbtn.cur{background:#c4d600;color:#12140a;border-color:#c4d600;font-weight:700}
.dnchip{background:#1e1e18;border:1px solid #3a3a30;border-radius:3px;
  padding:3px 8px;cursor:pointer;font-family:"Consolas","Segoe UI Mono",monospace;
  font-size:9.5px;color:#c8c8bc;display:inline-flex;align-items:center;gap:5px;
  transition:background .1s,border-color .1s;white-space:nowrap;user-select:none;
  pointer-events:auto}
.dnchip:hover{background:#2a2a20;border-color:#5a5a42;color:#ffffff}
.dnchip svg{flex-shrink:0}
/* ---------- map controls ---------- */

/* ---------- canvas ---------- */
#cv{flex:1;display:block;width:100%;cursor:crosshair}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);font-size:var(--fs-lg);color:var(--text)}
.hud.tl{top:9px;left:11px;display:flex;gap:6px;flex-direction:column;align-items:flex-start}
.hud.br{bottom:8px;right:11px;text-align:right}
.chip{background:#1a1a16;border:1px solid #3a3a30;border-radius:var(--r);padding:3px 8px;pointer-events:auto;color:#f0f0e8}
.zoomctl{display:flex;align-items:center;gap:2px;background:#1a1a16;border:1px solid #3a3a30;border-radius:var(--r);overflow:hidden;pointer-events:auto}
.zoomctl button{background:transparent;border:none;color:#ffffff;padding:3px 7px;cursor:pointer;font-family:var(--mono);font-size:var(--fs-xl);line-height:1}
.zoomctl button:hover{background:rgba(255,255,255,.15)}
.zoomctl select{background:transparent;border:none;color:#ffffff;font-family:var(--mono);font-size:var(--fs-xl);padding:3px 4px;cursor:pointer;outline:none;-webkit-appearance:none;min-width:84px;text-align:center}
.zoomctl select option{background:#111111;color:#ffffff}
.zoomctl .zdiv{width:1px;background:rgba(255,255,255,.18);align-self:stretch}
.legend{position:absolute;left:11px;bottom:8px;background:#1a1a16;border:1px solid #3a3a30;border-radius:var(--r);padding:7px 9px;font-family:var(--mono);font-size:var(--fs-md);color:#d8d8cc}
.legend .ramp{display:flex;height:7px;width:168px;border-radius:2px;overflow:hidden;margin:5px 0 3px}
.legend .ramp i{flex:1}
.legend .lr{display:flex;justify-content:space-between;width:168px;color:#c8c8bc}
.legend h6{font-size:var(--fs-sm);letter-spacing:.1em;color:#b0b0a0;font-weight:600;text-transform:uppercase}
.lkeys{display:grid;grid-template-columns:auto auto;gap:2px 10px;margin-top:7px;padding-top:6px;border-top:1px solid var(--line)}
.lkeys{color:#c8c8bc}.lkeys span{display:flex;align-items:center;gap:5px}
.lkeys b{width:8px;height:8px;border-radius:2px;display:inline-block}
.lenbox{position:absolute;background:#ffffff;border:1.5px solid var(--accent-dk);border-radius:var(--r);padding:3px 6px;font-family:var(--mono);font-size:var(--fs-2xl);width:104px;z-index:30;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.lenbox input{width:100%;background:transparent;border:none;outline:none;font-family:var(--mono)}

/* ---------- inspector ---------- */
.insp{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{flex:1;padding:9px 4px;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--dim2);font-size:var(--fs-lg);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom:2px solid var(--accent);background:var(--panel2);font-weight:700}
.panes{flex:1;overflow-y:auto;min-height:0}
.pane{display:none;padding:0 0 40px} .pane.on{display:block}

.card{border-bottom:1px solid var(--line)}
.card>h4{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:var(--fs-md);letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);cursor:pointer;user-select:none;font-weight:600}
.card>h4:hover{color:var(--text);background:var(--panel2)}
.card>h4 .cx{margin-left:auto;font-family:var(--mono);font-size:var(--fs-sm);color:var(--dim2);transition:transform .15s}
.card.closed .cx{transform:rotate(-90deg)}
.card.closed .cbody{display:none}
.cbody{padding:2px 12px 13px}
.cref{font-family:var(--mono);font-size:var(--fs-xs);color:var(--accent-text);opacity:.9;border:1px solid var(--accent-dk);padding:0 4px;border-radius:2px}

.row{display:grid;grid-template-columns:1fr 96px;gap:7px;align-items:center;margin-bottom:6px}
.row.w{grid-template-columns:1fr 1fr}
.row>label{font-size:var(--fs-2xl);color:var(--dim);line-height:1.25}
.row>label small{display:block;font-family:var(--mono);font-size:var(--fs-sm);color:var(--dim2)}
.fld{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px;width:100%;font-family:var(--mono);font-size:var(--fs-2xl);text-align:right}
.fld.err{border-color:#8f1f17;background:#fdf0ee;animation:fld-shake .32s}
@keyframes fld-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fld:hover{border-color:var(--line2)} .fld:focus{border-color:var(--accent);outline:none}
select.fld{text-align:left;cursor:pointer}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;background:var(--bg);border:none;padding:5px 2px;cursor:pointer;color:var(--dim);font-size:var(--fs-xl);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--panel3);color:var(--text)}
.seg button.on{background:var(--text);color:var(--accent)}
.note{font-size:var(--fs-lg);color:var(--dim2);line-height:1.45;margin-top:6px;padding:6px 8px;background:var(--panel2);border-left:2px solid var(--line2);border-radius:0 var(--r) var(--r) 0}
.note b{color:var(--dim)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;cursor:pointer;color:var(--dim);width:100%;font-size:var(--fs-2xl)}
.btn:hover{background:var(--panel3);color:var(--text);border-color:var(--line2)}
.btn.acc{background:var(--accent);border-color:var(--accent-dk);color:var(--accent-ink);font-weight:600}
.btn.acc:hover{background:var(--accent-dk)}
.btn.warn{color:#8f1f17;border-color:#e0b8b3;background:#fdf3f2}
.btn.warn:hover{background:#f9e4e1;border-color:#c1291f}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3.5px 0;border-bottom:1px dotted var(--line);font-size:var(--fs-2xl)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--dim)} .kv b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.kv b.ok{color:var(--ok)} .kv b.watch{color:var(--watch)} .kv b.high{color:var(--high)} .kv b.bad{color:var(--bad)}
.empty{padding:34px 20px;text-align:center;color:var(--dim2);font-size:var(--fs-2xl);line-height:1.6}
.empty svg{width:34px;height:34px;stroke:var(--line2);fill:none;stroke-width:1.2;margin-bottom:10px}

/* utilisation bar */
.ubar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin:3px 0 8px;border:1px solid var(--line)}
.ubar i{display:block;height:100%;transition:width .2s}

/* ---------- findings ---------- */
.findbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tally{display:flex;gap:5px}
.tally b{font-family:var(--mono);font-size:var(--fs-lg);padding:2px 6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);display:flex;gap:5px;align-items:center}
.tally b i{width:7px;height:7px;border-radius:50%;display:inline-block;font-style:normal}
.fgroup{border-bottom:1px solid var(--line2)}
.fgh{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--panel2);font-family:var(--mono);font-size:var(--fs-xl)}
.fgh b{color:var(--text);font-weight:700;letter-spacing:.02em}
.fgc{margin-left:auto;color:var(--dim2);font-size:var(--fs-md)}
.fgroup .find:last-child{border-bottom:none}
.find{border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer;border-left:3px solid transparent}
.find:hover{background:var(--panel2)}
.find.sel{background:var(--panel3);border-left-color:var(--accent)}
.find .fh{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.find .sev{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.find .ft{font-size:var(--fs-2xl);font-weight:600;flex:1;line-height:1.25}
.find .fl{font-family:var(--mono);font-size:var(--fs-sm);color:var(--dim2);border:1px solid var(--line);padding:1px 4px;border-radius:2px;flex-shrink:0}
.find .fd{font-size:var(--fs-xl);color:var(--dim);line-height:1.5;padding-left:14px}
.find .fx{font-size:var(--fs-xl);color:var(--accent-text);font-weight:500;line-height:1.5;padding-left:14px;margin-top:4px}
.find .fx::before{content:"→ ";opacity:.6}
.find .fnum{font-family:var(--mono);color:var(--text)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:var(--fs-lg)}
.tbl th{text-align:right;padding:5px 6px;color:var(--dim2);font-weight:500;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel);font-size:var(--fs-base);letter-spacing:.05em}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--panel2)}
.tbl tr.sel td{background:var(--panel3)}
.tbl .ok{color:var(--ok)} .tbl .watch{color:var(--watch)} .tbl .high{color:var(--high)} .tbl .bad{color:var(--bad)}

/* ---------- status ---------- */
.status{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-family:var(--mono);font-size:var(--fs-md);color:#3a3a34}
.status b{color:#111111;font-weight:600}
.status .sp{margin-left:auto}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:#040709cc;display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.veil.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:6px;width:min(820px,92vw);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 70px #000b}
.mtabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line)}
.mtabs button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--dim2);padding:9px 4px;margin-right:18px;cursor:pointer;font-size:var(--fs-xl);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.mtabs button:hover{color:var(--text)}
.mtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin:8px 0 14px}
.kgrid .kitem{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-xl);color:var(--dim);line-height:1.4}
.kgrid .kitem svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:1.6;flex-shrink:0;margin-top:1px}
.kgrid kbd{background:var(--bg);border:1px solid var(--line2);border-radius:3px;padding:0 5px;font-family:var(--mono);font-size:var(--fs-md);color:var(--text);flex-shrink:0}
.codetbl{width:100%;font-size:var(--fs-xl);border-collapse:collapse;margin-bottom:6px}
.codetbl td{padding:5px 10px 5px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.codetbl td:first-child{white-space:nowrap;font-family:var(--mono);color:var(--text);width:86px}
.codetbl .sv{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;flex-shrink:0}
.modal header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:var(--fs-body);letter-spacing:.06em;font-weight:600}
.modal header .x{margin-left:auto;background:none;border:none;color:var(--dim2);cursor:pointer;font-size:var(--fs-h2);line-height:1}
.modal header .x:hover{color:var(--text)}
.modal .mb{padding:16px;overflow-y:auto;font-size:var(--fs-2xl);line-height:1.65;color:var(--dim)}
.modal .mb h5{color:var(--text);font-size:var(--fs-xl);letter-spacing:.1em;text-transform:uppercase;margin:16px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.modal .mb h5:first-child{margin-top:0}
.modal .mb p{margin-bottom:9px}
.modal .mb code{font-family:var(--mono);background:var(--panel2);padding:1px 5px;border-radius:3px;color:var(--accent-text);font-size:var(--fs-xl)}
.modal .mb ul{margin:0 0 10px 17px} .modal .mb li{margin-bottom:5px}
.modal footer{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal footer .btn{width:auto;padding:6px 16px}
.tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tpl{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left}
.tpl:hover{border-color:var(--accent);background:var(--panel3)}
.tpl svg{width:100%;height:62px;stroke:var(--accent);fill:none;stroke-width:2.4;margin-bottom:7px;opacity:.85}
.tpl b{display:block;font-size:var(--fs-2xl);color:var(--text);margin-bottom:2px}
.tpl span{font-size:var(--fs-md);color:var(--dim2);line-height:1.4;display:block}
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);padding:8px 15px;font-size:var(--fs-2xl);z-index:200;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.warnbanner{background:#fbf1dc;border-bottom:1px solid #e8c97a;color:#7a5a00;padding:6px 12px;font-size:var(--fs-xl);display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="brand"><b>THERMOLINE</b><span>EN 13941</span></div>
  <input class="projname" id="projName" value="Untitled network" spellcheck="false" aria-label="Project name">
  <div class="tbgroup">
    <button class="tb" id="btnNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
    <button class="tb" id="btnTemplates"><svg viewBox="0 0 24 24"><path d="M3 7h7V3H3zM14 21h7v-4h-7zM3 21h7V11H3zM14 13h7V3h-7z"/></svg>Templates</button>
    <button class="tb" id="btnOpen"><svg viewBox="0 0 24 24"><path d="M3 7v13h18V7M3 7l2-3h6l2 3h8"/></svg>Open</button>
