/* hit tests -------------------------------------------------------------*/
function hitNode(sx,sy,rad){
  rad=rad||11; let best=null,bd=rad;
  for(const n of Object.values(M.nodes)){
    const p=W2S(n.x,n.y),d=Math.hypot(p.x-sx,p.y-sy);
    if(d<bd){bd=d;best=n;}
  }
  return best;
}
function hitEdge(sx,sy,rad){
  rad=rad||9; let best=null,bd=rad,bt=0;
  for(const e of Object.values(M.edges)){
    const A=M.nodes[e.a],B=M.nodes[e.b];if(!A||!B)continue;
    const a=W2S(A.x,A.y),b=W2S(B.x,B.y);
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
    let t=((sx-a.x)*dx+(sy-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(a.x+t*dx-sx,a.y+t*dy-sy);
    if(d<bd){bd=d;best=e;bt=t;}
  }
  return best?{e:best,t:bt}:null;
}
function splitEdge(e,t){
  const A=M.nodes[e.a],B=M.nodes[e.b];
  const x=A.x+(B.x-A.x)*t, y=A.y+(B.y-A.y)*t;
  const nid=addNode(x,y,'auto');
  const props={dn:e.dn,series:e.series,cover:e.cover,soil:e.soil};
  const b=e.b; delete M.edges[e.id];
  addEdge(e.a,nid,props); addEdge(nid,b,props);
  return nid;
}

/* ---- U-loop / Z-offset insertion ---------------------------------------
   Both build real, editable pipe geometry (not just a marker) so the
   pad-fit and Z/loop-leg checks in the engine apply to them directly.    */
/* Minimum loop leg = the pad zone F that the arriving movement will need.
   F = 0.124 * d^0.48 * dL^0.25.   We estimate dL as the full friction-length
   movement of the main pipe at 20 % margin. Pads then exactly fill the leg,
   which is the minimum acceptable.  Add one Dc width on each end for the bend
   itself.  The width (crown) just needs to clear two casings + working space. */
function minLegForPads(dn){
  const pip=pipeByDn(dn);
  const ser=M.def.series||2, Dc=pip.Dc[ser-1]/1000;
  const th=thermal();
  const F_est=friction(pip,ser,{g:M.soil.g,K0:M.soil.K0,mu:M.soil.mu,gwl:M.soil.gwl},M.soil.cover);
  const As=pip.As, E=th.E, al=th.al, dT=th.dTgov;
  const sigM=Math.max(1,dT*E*al);
  const LF=sigM*As/Math.max(F_est*1000,0.01);
  const Lm=Math.min(LF,300)*1000; /* mm, cap at 300 m section */
  const dL_mm=Math.max(10,Math.min(100, al*dT*Lm - F_est*1000*Lm*Lm/(2*E*As)));
  /* pad zone F in metres — this IS the minimum leg.
     Use 1.15 * dL to account for LOOP-1 movement propagation.           */
  const dL_safe=Math.min(120, dL_mm*1.15);
  const F_m=0.124*Math.pow(pip.d,0.48)*Math.pow(dL_safe,0.25);
  /* add Dc on each end so the bend node sits clear of the pad zone */
  return Math.ceil((F_m + Dc)*10)/10;
}
function loopDefaults(dn){
  const depth=Math.max(2, minLegForPads(dn));
  const pip=pipeByDn(dn), ser=M.def.series||2, Dc=pip.Dc[ser-1]/1000;
  const width=Math.max(1.0, Math.ceil((Dc*2+0.4)*10)/10);
  return{depth,width};
}
function zOffsetDefault(dn){
  return Math.max(1.5, minLegForPads(dn));
}
function unitPerp(dir,flip){return flip?{x:dir.y,y:-dir.x}:{x:-dir.y,y:dir.x};}

/* click on an existing straight pipe: split it and splice the detour in,
   reconnecting to the original far node so the rest of the route is
   undisturbed. */


function insertDetourOnEdge(kind,he,ev){
  const e=he.e;
  const opts={dn:e.dn,series:e.series,cover:e.cover,soil:e.soil};
  const Ax=M.nodes[e.a].x,Ay=M.nodes[e.a].y,Bx=M.nodes[e.b].x,By=M.nodes[e.b].y;
  const L=Math.hypot(Bx-Ax,By-Ay)||1;
  const dir={x:(Bx-Ax)/L,y:(By-Ay)/L};
  const farB=e.b;
  const splitNode=splitEdge(e,he.t);
  const es2=edgesAt(splitNode);
  const fwd=es2.find(ee=>other(ee,splitNode)===farB);
  if(fwd)delete M.edges[fwd.id];
  const flip=!!(ev&&ev.shiftKey);
  const exit=buildDetour(kind,splitNode,dir,opts,flip);
  addEdge(exit,farB,opts);
  select('node',splitNode);
  snapshot();run();
  autoResizeLoopAfterInsert(splitNode,kind);
  toast((kind==='uloop'?'U-loop':'Z-offset')+' inserted \u2014 Shift to flip side');
}

function insertDetourWhileDrawing(kind,ev){
  if(!draw.active||!draw.lastNode)return;
  const nid=draw.lastNode, es=edgesAt(nid);
  let dir=null, opts={dn:M.def.dn,series:M.def.series};
  if(es.length){
    const prev=other(es[0],nid);
    const px=M.nodes[prev].x,py=M.nodes[prev].y,cx=M.nodes[nid].x,cy=M.nodes[nid].y;
    const L=Math.hypot(cx-px,cy-py)||1;
    dir={x:(cx-px)/L,y:(cy-py)/L};
    opts={dn:es[0].dn,series:es[0].series};
  } else if(draw.preview){
    const cx=M.nodes[nid].x,cy=M.nodes[nid].y;
    const dx=draw.preview.x-cx,dy=draw.preview.y-cy,L=Math.hypot(dx,dy)||1;
    dir={x:dx/L,y:dy/L};
  } else dir={x:1,y:0};
  const flip=!!(ev&&ev.shiftKey);
  const exit=buildDetour(kind,nid,dir,opts,flip);
  draw.lastNode=exit; draw.preview=null;
  snapshot();run();
  autoResizeLoopAfterInsert(exit,kind);
  toast((kind==='uloop'?'U-loop':'Z-offset')+' added \u2014 Shift to flip side');
}

/* shared geometry builder used by both entry points above */
function buildDetour(kind,fromId,dir,opts,flip){
  const A=M.nodes[fromId], perp=unitPerp(dir,flip);
  if(kind==='uloop'){
    const{depth,width}=loopDefaults(opts.dn);
    const p1=addNode(A.x+perp.x*depth,A.y+perp.y*depth,'auto');
    addEdge(fromId,p1,opts);
    const p2=addNode(M.nodes[p1].x+dir.x*width,M.nodes[p1].y+dir.y*width,'auto');
    addEdge(p1,p2,opts);
    const p3=addNode(M.nodes[p2].x-perp.x*depth,M.nodes[p2].y-perp.y*depth,'auto');
    addEdge(p2,p3,opts);
    /* tag all internal nodes so auto-resize can identify them.
       _loopEntry links each interior node back to its entry so we never
       accidentally walk into an adjacent loop's nodes.                  */
    M.nodes[p1]._loop=true; M.nodes[p1]._loopEntry=fromId;
    M.nodes[p2]._loop=true; M.nodes[p2]._loopEntry=fromId;
    M.nodes[p3]._loop=true; M.nodes[p3]._loopEntry=fromId;
    M.nodes[fromId]._loopDir=dir; M.nodes[fromId]._loopPerp=perp;
    M.nodes[p3]._loopExit=true;
    return p3;
  }
  const off=zOffsetDefault(opts.dn);
  const p1=addNode(A.x+perp.x*off,A.y+perp.y*off,'auto');
  M.nodes[p1]._loop=true;
  addEdge(fromId,p1,opts);
  return p1;
}

/* auto-resize a just-inserted loop/Z so all pad legs fit ------------------
   Runs after the first analysis, which gives us the actual delivered movement.
   Walks nodes on the loop and expands legs that have PAD-1 pending.           */
function autoResizeLoopAfterInsert(tipId, kind){
  if(!R)return;

  /* Walk back from tipId to find the entry node for THIS loop only.
     The entry node has _loopDir AND is connected (directly or via _loop chain)
     to tipId. We walk up to 6 hops along _loop-tagged nodes. */
  let entryId=null;
  const visited=new Set();
  let cur=tipId;
  for(let i=0;i<8;i++){
    if(M.nodes[cur]&&M.nodes[cur]._loopDir){entryId=cur;break;}
    visited.add(cur);
    /* step to a neighbour that is a _loop node (interior of this loop) */
    const next=edgesAt(cur)
      .map(e=>other(e,cur))
      .find(id=>M.nodes[id]&&M.nodes[id]._loop&&!visited.has(id));
    if(!next)break;
    cur=next;
  }
  if(!entryId)return;
  const entry=M.nodes[entryId];
  const dir=entry._loopDir, perp=entry._loopPerp;
  if(!dir||!perp)return;

  /* Collect the chain for THIS loop only: walk from entry through directly
     connected _loop nodes that belong to this entry (via _loopEntry tag). */
  const chain=[entryId];
  const seen=new Set([entryId]);
  let walker=entryId;
  for(let i=0;i<6;i++){
    const next=edgesAt(walker)
      .map(e=>other(e,walker))
      .find(id=>M.nodes[id]&&M.nodes[id]._loop&&
                M.nodes[id]._loopEntry===entryId&&!seen.has(id));
    if(!next)break;
    chain.push(next);
    seen.add(next);
    walker=next;
  }
  if(chain.length<4)return; /* need entry + p1 + p2 + p3 */

  /* Determine required dimensions from pad analysis */
  let reqDepth=0, reqWidth=0;
  for(const nid of chain){
    const r=R.NR[nid]; if(!r||!r.pad)continue;
    r.pad.legs.forEach(leg=>{
      if(leg.F>leg.avail){reqDepth=Math.max(reqDepth,leg.F+0.2);}
    });
    if(r.pad.zNeed&&r.pad.zHave<r.pad.zNeed){
      reqWidth=Math.max(reqWidth,r.pad.zNeed+0.2);
    }
  }
  if(reqDepth<=0&&reqWidth<=0)return;

  const p1n=M.nodes[chain[1]], p2n=M.nodes[chain[2]];
  const curDepth=Math.abs(perp.x*(p1n.x-entry.x)+perp.y*(p1n.y-entry.y));
  const curWidth=Math.abs(dir.x*(p2n.x-p1n.x)+dir.y*(p2n.y-p1n.y));
  const newDepth=Math.max(curDepth,reqDepth);
  const newWidth=Math.max(curWidth,reqWidth,reqDepth);
  if(Math.abs(newDepth-curDepth)<0.05&&Math.abs(newWidth-curWidth)<0.05)return;

  /* Rebuild the rectangle preserving entry position */
  M.nodes[chain[1]].x=entry.x+perp.x*newDepth;
  M.nodes[chain[1]].y=entry.y+perp.y*newDepth;
  M.nodes[chain[2]].x=M.nodes[chain[1]].x+dir.x*newWidth;
  M.nodes[chain[2]].y=M.nodes[chain[1]].y+dir.y*newWidth;
  M.nodes[chain[3]].x=entry.x+dir.x*newWidth;
  M.nodes[chain[3]].y=entry.y+dir.y*newWidth;
  run();   /* no snapshot here — caller already snapshotted after buildDetour */

  /* Second pass: if pads still don't fit after the first resize, expand once more */
  if(R){
    let maxF=0;
    for(const nid of chain){
      const r2=R.NR[nid]; if(!r2||!r2.pad)continue;
      r2.pad.legs.forEach(l=>{if(l.F>l.avail+0.05)maxF=Math.max(maxF,l.F+0.2);});
    }
    if(maxF>newDepth+0.05){
      M.nodes[chain[1]].x=entry.x+perp.x*maxF;
      M.nodes[chain[1]].y=entry.y+perp.y*maxF;
      M.nodes[chain[2]].x=M.nodes[chain[1]].x+dir.x*Math.max(newWidth,maxF*0.9);
      M.nodes[chain[2]].y=M.nodes[chain[1]].y+dir.y*Math.max(newWidth,maxF*0.9);
      M.nodes[chain[3]].x=entry.x+dir.x*Math.max(newWidth,maxF*0.9);
      M.nodes[chain[3]].y=entry.y+dir.y*Math.max(newWidth,maxF*0.9);
      run();
    }
  }
}

/* snapping --------------------------------------------------------------*/
function snapPoint(wx,wy,ev){
  const sp=W2S(wx,wy);
  draw.snap=null;
  const n=hitNode(sp.x,sp.y,13);
  if(n){draw.snap={x:n.x,y:n.y,node:n.id};return{x:n.x,y:n.y,node:n.id};}
  const he=hitEdge(sp.x,sp.y,tool==='branch'?16:9);
  if(he&&tool!=='select'){
    const A=M.nodes[he.e.a],B=M.nodes[he.e.b];
    const x=A.x+(B.x-A.x)*he.t,y=A.y+(B.y-A.y)*he.t;
    draw.snap={x,y,edge:he.e.id,t:he.t};return{x,y,edge:he.e.id,t:he.t};
  }
  /* branch tool: no grid snap — only valid placement is on a pipe */
  if(tool==='branch')return{x:wx,y:wy};
  if(ev&&ev.altKey)return{x:wx,y:wy};
  const g=niceStep(58)/4;
  return{x:Math.round(wx/g)*g,y:Math.round(wy/g)*g};
}
function snapFrom(ax,ay,wx,wy,ev,axisDir){
  if(ev&&ev.altKey)return{x:wx,y:wy};
  let dx=wx-ax,dy=wy-ay,L=Math.hypot(dx,dy);
  if(L<1e-6)return{x:wx,y:wy};
  let a=Math.atan2(dy,dx)*180/Math.PI;
  const inc=ev&&ev.shiftKey?90:15;
  /* If we have a parent pipe axis, rotate the angle space so the axis
     direction is 0 deg, snap there, then rotate back. This makes
     perpendicular (90 deg) and along (0/180) the natural snap points. */
  if(axisDir){
    const axisAng=Math.atan2(axisDir.y,axisDir.x)*180/Math.PI;
    let rel=((a-axisAng)%360+360)%360;
    if(rel>180)rel-=360;
    rel=Math.round(rel/inc)*inc;
    a=axisAng+rel;
  } else {
    a=Math.round(a/inc)*inc;
  }
  const g=Math.max(0.5,niceStep(58)/10);
  L=Math.round(L/g)*g;
  const rad=a*Math.PI/180;
  return{x:ax+Math.cos(rad)*L,y:ay+Math.sin(rad)*L};
}

/* drawing ---------------------------------------------------------------*/
function beginDraw(nid){draw.active=true;draw.lastNode=nid;}
function endDraw(){
  if(draw.active){
    /* if the last node has no edges it was a lone first-click — remove it */
    if(draw.lastNode&&edgesAt(draw.lastNode).length===0)
      delete M.nodes[draw.lastNode];
    draw.active=false;draw.lastNode=null;draw.preview=null;
    draw.branchDir=null;hideLen();snapshot();run();}
  draw.snap=null;render();
}
function placePoint(w,ev){
  let target=null;
  if(w.node)target=w.node;
  else if(w.edge){const e=M.edges[w.edge];target=splitEdge(e,w.t);}
  if(!draw.active){
    if(!target)target=addNode(w.x,w.y,'auto');
    beginDraw(target);return;
  }
  const A=M.nodes[draw.lastNode];
  const s=(w.node||w.edge)?{x:w.x,y:w.y}:snapFrom(A.x,A.y,w.x,w.y,ev);
  if(!target)target=addNode(s.x,s.y,'auto');
  if(target!==draw.lastNode&&Math.hypot(M.nodes[target].x-A.x,M.nodes[target].y-A.y)>0.05){
    addEdge(draw.lastNode,target); draw.lastNode=target;
    draw.branchDir=null;   /* after first segment, snap back to free 15° increments */
    snapshot(); run();
  }
}

  const A=M.nodes[draw.lastNode],p=W2S(A.x,A.y);

  ev.stopPropagation();
  if(ev.key==='Enter'){
    const v=parseFloat(lenInput.value);
    if(v>0&&draw.lastNode){
      const A=M.nodes[draw.lastNode];
      let ang=draw.preview?Math.atan2(draw.preview.y-A.y,draw.preview.x-A.x):0;
      const inc=15*Math.PI/180; ang=Math.round(ang/inc)*inc;
      const id=addNode(A.x+Math.cos(ang)*v,A.y+Math.sin(ang)*v,'auto');
      addEdge(draw.lastNode,id);draw.lastNode=id;snapshot();run();
    }

});

/* mouse -----------------------------------------------------------------*/
let pan=null, dragNode=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',ev=>{
  hideDnPicker();
  const r=cv.getBoundingClientRect(), sx=ev.clientX-r.left, sy=ev.clientY-r.top;
  const w=S2W(sx,sy);
  if(ev.button===1||ev.button===2||(ev.button===0&&ev.code==='Space')){
    pan={sx,sy,tx:V.tx,ty:V.ty};return;
  }
  if(ev.button!==0)return;
  /* badge click: navigate to first finding in the group */
  const hitBadge=_badges.find(b=>Math.hypot(sx-b.bx,sy-b.by)<=b.r+8);
  if(hitBadge&&hitBadge.list.length){
    const f=hitBadge.list[0];
    sel={kind:'find',id:f.id};
    showTab('pFindings');
    buildFindingsPane();
    /* scroll to the finding */
    setTimeout(()=>{const el=document.querySelector('[data-find="'+f.id+'"]');if(el)el.scrollIntoView({block:'nearest'});},50);
    render();return;
  }
  const sn=snapPoint(w.x,w.y,ev);
  if(tool==='route'){placePoint(sn,ev);render();return;}
  if(tool==='branch'){
    const he=hitEdge(sx,sy,11);
    if(he){
      const eDir=he.e;
      const nid=splitEdge(eDir,he.t);
      /* record parent pipe unit vector so snapping is perpendicular by default */
      const A2=M.nodes[eDir.a]||M.nodes[Object.keys(M.nodes).slice(-2,-1)[0]];
      const B2=M.nodes[eDir.b]||M.nodes[Object.keys(M.nodes).slice(-1)[0]];
      if(A2&&B2){
        const L2=Math.hypot(B2.x-A2.x,B2.y-A2.y)||1;
        draw.branchDir={x:(B2.x-A2.x)/L2,y:(B2.y-A2.y)/L2};
      } else draw.branchDir=null;
      beginDraw(nid);tool='route';syncRail();snapshot();run();
    } else toast('Click on an existing pipe to branch from it');
    return;
  }
  if(tool==='insuloop'||tool==='insz'){
    const he=hitEdge(sx,sy,11);
    if(he)insertDetourOnEdge(tool==='insuloop'?'uloop':'zoffset',he,ev);
    else toast('Click on an existing pipe to insert it there');
    return;
  }
  if(tool==='erase'){
    const n=hitNode(sx,sy);
    if(n){delNode(n.id);snapshot();run();return;}
    const he=hitEdge(sx,sy);
    if(he){delEdge(he.e.id);snapshot();run();}
    return;
  }
  if(['anchor','free','ecomp','valve','clear'].includes(tool)){
    let n=hitNode(sx,sy,14);
    if(!n){const he=hitEdge(sx,sy,10);if(he)n=M.nodes[splitEdge(he.e,he.t)];}
    if(n){n.type=(tool==='clear')?'auto':tool;select('node',n.id);snapshot();run();}
    return;
  }
  /* select tool */
  const n=hitNode(sx,sy);
  if(n){select('node',n.id);dragNode={id:n.id,ox:n.x-w.x,oy:n.y-w.y,moved:false};return;}
  const he=hitEdge(sx,sy);
  if(he){select('edge',he.e.id);return;}
  select(null,null); pan={sx,sy,tx:V.tx,ty:V.ty};
});
window.addEventListener('mousemove',ev=>{
  const r=cv.getBoundingClientRect(), sx=ev.clientX-r.left, sy=ev.clientY-r.top;
  mouse.x=sx;mouse.y=sy;
  const w=S2W(sx,sy); mouse.wx=w.x; mouse.wy=w.y;
  if(pan){V.tx=pan.tx+(sx-pan.sx);V.ty=pan.ty+(sy-pan.sy);render();return;}
  if(dragNode){
    const n=M.nodes[dragNode.id];
    const sn=snapPoint(w.x+dragNode.ox,w.y+dragNode.oy,ev);
    n.x=sn.x;n.y=sn.y;dragNode.moved=true;run();return;
  }
  if(sx<0||sy<0||sx>V.w||sy>V.h){return;}
  if(draw.active&&draw.lastNode){
    const A=M.nodes[draw.lastNode];
    const sn=snapPoint(w.x,w.y,ev);
    draw.preview=(sn.node||sn.edge)?{x:sn.x,y:sn.y}:snapFrom(A.x,A.y,sn.x,sn.y,ev,draw.branchDir);
    render();return;
  }
  if(tool==='branch'||(!draw.active&&tool==='route')||
     ['anchor','free','ecomp','valve','insuloop','insz'].includes(tool)){
    /* Priority 1: snap hard to any pipe endpoint within 18 screen pixels.
       This gives clean continuation when approaching a pipe end, and is
       more reliable than a world-metre threshold which varies with zoom.  */
    let snapNode=null, snapNodeD=Infinity;
    for(const n of Object.values(M.nodes)){
      const ns=W2S(n.x,n.y);
      const d=Math.hypot(ns.x-sx,ns.y-sy);
      if(d<18&&d<snapNodeD){snapNodeD=d;snapNode=n;}
    }
    if(snapNode){
      draw.snap={x:snapNode.x,y:snapNode.y,node:snapNode.id};
      render();return;
    }
    /* Priority 2: project onto nearest pipe body within SNAP_RADIUS screen px */
    const SNAP_RADIUS=40;
    let bestE=null,bestT=0,bestD=Infinity;
    for(const e of Object.values(M.edges)){
      const A=M.nodes[e.a],B=M.nodes[e.b];if(!A||!B)continue;
      const a=W2S(A.x,A.y),b=W2S(B.x,B.y);
      const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
      let t=((sx-a.x)*dx+(sy-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(a.x+t*dx-sx,a.y+t*dy-sy);
      if(d<bestD){bestD=d;bestE=e;bestT=t;}
    }
    if(bestE&&bestD<=SNAP_RADIUS){
      const A=M.nodes[bestE.a],B=M.nodes[bestE.b];
      const x=A.x+(B.x-A.x)*bestT,y=A.y+(B.y-A.y)*bestT;
      draw.snap={x,y,edge:bestE.id,t:bestT};
    } else draw.snap=null;
    render();return;
  }
  if(tool!=='select')snapPoint(w.x,w.y,ev);
  const n=hitNode(sx,sy); const he=n?null:hitEdge(sx,sy);
  const nh={kind:n?'node':(he?'edge':null),id:n?n.id:(he?he.e.id:null)};
  /* badge hit-test */
  const hitBadge=_badges.find(b=>Math.hypot(sx-b.bx,sy-b.by)<=b.r+6);
  if(hitBadge){
    if(badgeHover.g!==hitBadge){
      badgeHover={g:hitBadge,px:hitBadge.bx,py:hitBadge.by};
      cv.style.cursor='pointer'; render();
    }else drawHud();
  } else {
    if(badgeHover.g){badgeHover={g:null,px:0,py:0};cv.style.cursor=tool==='select'?'default':'crosshair';render();}
    else if(nh.kind!==hover.kind||nh.id!==hover.id){hover=nh;render();}
    else drawHud();
  }
});
window.addEventListener('mouseup',()=>{
  if(dragNode&&dragNode.moved)snapshot();
  pan=null;dragNode=null;
});
cv.addEventListener('dblclick',()=>{if(draw.active)endDraw();});
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=cv.getBoundingClientRect(), sx=ev.clientX-r.left, sy=ev.clientY-r.top;
  const before=S2W(sx,sy);
  const f=Math.exp(-ev.deltaY*0.0016);
  V.sc=Math.max(0.03,Math.min(200,V.sc*f));
  const after=S2W(sx,sy);
  V.tx+=(after.x-before.x)*V.sc; V.ty+=(after.y-before.y)*V.sc;
  render();
},{passive:false});

window.addEventListener('keydown',ev=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=ev.key.toLowerCase();
  if(ev.ctrlKey||ev.metaKey){
    if(k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();}
    if(k==='y'){ev.preventDefault();redo();}
    if(k==='s'){ev.preventDefault();saveFile();}
    return;
  }
  if(ev.key==='Escape'){hideDnPicker();if(draw.active)endDraw();else select(null,null);return;}
  if(ev.key==='Enter'){if(draw.active)endDraw();return;}
  if(ev.key==='Delete'||ev.key==='Backspace'){
    if(sel.kind==='node'){delNode(sel.id);select(null,null);snapshot();run();}
    else if(sel.kind==='edge'){delEdge(sel.id);select(null,null);snapshot();run();}
    return;
  }
  if(ev.key==='Home'){fit();return;}
  /* D key toggles the DN picker while in route mode */
  if(k==='d'&&tool==='route'){toggleDnPicker();return;}
  if(draw.active&&/^[0-9.]$/.test(ev.key)){showLen();lenInput.value=ev.key;return;}
  if((k==='o'||k==='z')&&draw.active){
    insertDetourWhileDrawing(k==='o'?'uloop':'zoffset',ev);
    return;
  }
  const map={v:'select',r:'route',b:'branch',x:'erase',a:'anchor',f:'free',e:'ecomp',w:'valve',
             o:'insuloop',z:'insz'};
  if(map[k]){tool=map[k];endDraw();hideDnPicker();syncRail();}
  if(k==='l'){M.view.labels=!M.view.labels;render();syncRail();}
  if(k==='k'){M.view.angles=!M.view.angles;render();syncRail();}
});

  else if(el.type==='number'){v=parseFloat(el.value);if(isNaN(v))v=0;}
  else{
    /* For selects, check if the current stored value is a number.
       If so, coerce the new value too (e.g. dn, series).           */
    const cur=getPath(M,el.dataset.bind);
    const asNum=parseFloat(el.value);
    v=(typeof cur==='number'&&!isNaN(asNum))?asNum:el.value;

  setPath(M,el.dataset.bind,v); onModelChange();

function onModelChange(light){
  if(M.soil.preset&&SOILS[M.soil.preset]&&M.soil.preset!=='custom'&&!M._soilTouch){
    const s=SOILS[M.soil.preset];M.soil.g=s.g;M.soil.K0=s.K0;M.soil.mu=s.mu;
  }
  M._soilTouch=false;
  if(M.design.duty&&DUTY[M.design.duty]&&!M._dutyTouch)M.design.cycles=DUTY[M.design.duty];
  M._dutyTouch=false;
  run(); if(!light)snapshot();
}

function syncProject(){
  document.querySelectorAll('#pProject [data-bind]').forEach(el=>{
    if(el===document.activeElement)return;
    const v=getPath(M,el.dataset.bind);
    if(el.type==='checkbox')el.checked=!!v; else el.value=v;

    const[p,v]=b.dataset.set.split('|');
    let cur=getPath(M,p);
    b.classList.toggle('on',String(cur)===v);
  });
  document.querySelectorAll('[data-toggle]').forEach(b=>

function buildElementPane(){
  const el=$('pElement');
  if(!sel.kind||sel.kind==='find'){
    el.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 20h6l4-8h8"/>'+
      '<circle cx="3" cy="20" r="1.6"/><circle cx="21" cy="12" r="1.6"/></svg>'+
      'Nothing selected.<br><br>Draw with <b>R</b>, branch with <b>B</b>, select with <b>V</b>.<br>'+
      'Click a pipe or a node to edit it and see its results.</div>';return;
  }
  if(sel.kind==='node')el.innerHTML=nodePane(M.nodes[sel.id]);
  else el.innerHTML=edgePane(M.edges[sel.id]);
  const lenInput2=$('elLen');
  if(lenInput2){
    lenInput2.onchange=()=>{
      const v=parseFloat(lenInput2.value);
      const ed=M.edges[sel.id]; if(!ed)return;
      if(!v||isNaN(v)||v<0.1){
        lenInput2.classList.add('err');
        lenInput2.title='Enter a length of at least 0.1 m';
        lenInput2.value=fmt(edgeLen(ed),1);
        setTimeout(()=>lenInput2.classList.remove('err'),1400);
        return;
      }
      const A=M.nodes[ed.a],B=M.nodes[ed.b]; if(!A||!B)return;
      const cur=Math.hypot(B.x-A.x,B.y-A.y)||1;
      const ux=(B.x-A.x)/cur, uy=(B.y-A.y)/cur;
      B.x=A.x+ux*v; B.y=A.y+uy*v;
      snapshot();run();buildElementPane();
    };
  }
  const del=$('elDel'); if(del)del.onclick=()=>{
    if(sel.kind==='node')delNode(sel.id);else delEdge(sel.id);
    select(null,null);snapshot();run();};
  const sp=$('elSplit'); if(sp)sp.onclick=()=>{const n=splitEdge(M.edges[sel.id],0.5);
    snapshot();run();select('node',n);};
  syncElement();
}
function syncElement(){
  document.querySelectorAll('#pElement [data-bind]').forEach(el=>{
    if(el===document.activeElement)return;
    const v=getPath(M,el.dataset.bind);
    el.value=(v===null||v===undefined)?'':v;
  });
  document.querySelectorAll('#pElement [data-set]').forEach(b=>{
    const[p,v]=b.dataset.set.split('|');
    b.classList.toggle('on',String(getPath(M,p))===v);
  });
}

/* ---- FINDINGS PANE ---------------------------------------------------- */
function buildFindingsPane(){
  const el=$('pFindings');
  if(!R){el.innerHTML='';return;}
  const t=R.tally;
  const bar='<div class="findbar"><div class="tally">'+
    ['critical','high','watch','info'].map(s=>'<b><i style="background:'+SEVC[s]+
      '"></i>'+t[s]+'</b>').join('')+'</div>'+
    '<span style="margin-left:auto;font-family:var(--mono);font-size:var(--fs-md);color:var(--dim2)">'+
    R.findings.length+' items</span></div>';
  if(!R.findings.length){el.innerHTML=bar+'<div class="empty">No findings.</div>';return;}

  /* Resolve a display tag for each finding's location */
  const tagFor=f=>{
    if(!f.loc)return null;
    if(f.loc.k==='node')return REF[f.loc.id]||null;
    if(f.loc.k==='edge')return REF[f.loc.id]||null;
    if(f.loc.k==='section'){
      const S=R.sections.find(s=>s.id===f.loc.id);
      if(S&&S.edges&&S.edges.length){
        const mid=S.edges[Math.floor(S.edges.length/2)];
        return REF[mid.id]||null;
      }
    }
    return null;
  };
  const sevRank={critical:0,high:1,watch:2,info:3};

  /* Group findings by tag, preserving first-seen order; findings with no
     resolvable tag fall into a final "Network" group.                    */
  const groups=[]; const byTag={};
  R.findings.forEach(f=>{
    const tag=tagFor(f)||'Network';
    if(!byTag[tag]){byTag[tag]={tag,items:[],worst:'info'};groups.push(byTag[tag]);}
    byTag[tag].items.push(f);
    if(sevRank[f.sev]<sevRank[byTag[tag].worst])byTag[tag].worst=f.sev;
  });
  /* order groups by worst severity, then by tag string (J- before PS- before FP- before Network) */
  const tagOrder=tg=>tg==='Network'?9:tg[0]==='J'?0:tg[0]==='P'?1:tg[0]==='F'?2:3;
  groups.sort((a,b)=>sevRank[a.worst]-sevRank[b.worst]||tagOrder(a.tag)-tagOrder(b.tag)||a.tag.localeCompare(b.tag));
  groups.forEach(g=>g.items.sort((a,b)=>sevRank[a.sev]-sevRank[b.sev]));

  el.innerHTML=bar+groups.map(g=>
    '<div class="fgroup" data-grouptag="'+g.tag+'">'+
    '<div class="fgh"><span class="sev" style="background:'+SEVC[g.worst]+'"></span>'+
    '<b>'+g.tag+'</b><span class="fgc">'+g.items.length+(g.items.length===1?' item':' items')+'</span></div>'+
    g.items.map(f=>
      '<div class="find'+(sel.kind==='find'&&sel.id===f.id?' sel':'')+'" data-find="'+f.id+'">'+
      '<div class="fh"><span class="sev" style="background:'+SEVC[f.sev]+'"></span>'+
      '<span class="ft">'+f.title+'</span><span class="fl">'+f.code+'</span></div>'+
      '<div class="fd">'+f.detail+'</div>'+
      (f.fix?'<div class="fx">'+f.fix+'</div>':'')+
      (f.ref?'<div class="fd" style="color:var(--dim2);font-size:var(--fs-md);margin-top:4px">'+f.ref+'</div>':'')+
      '</div>').join('')+
    '</div>').join('');

  el.querySelectorAll('[data-find]').forEach(d=>d.onclick=()=>{
    const f=R.findings.find(x=>x.id===d.dataset.find);
    sel={kind:'find',id:f.id};
    buildFindingsPane();
    if(f.loc.k==='node')zoomTo(f.loc.id);
    else if(f.loc.k==='edge'){const e=M.edges[f.loc.id];
      if(e){const A=M.nodes[e.a],B=M.nodes[e.b];
        V.tx=V.w/2-(A.x+B.x)/2*V.sc;V.ty=V.h/2-(A.y+B.y)/2*V.sc;}}
    else if(f.loc.k==='section'){const S=R.sections.find(s=>s.id===f.loc.id);
      if(S){const e=S.edges[Math.floor(S.edges.length/2)],A=M.nodes[e.a],B=M.nodes[e.b];
        V.tx=V.w/2-(A.x+B.x)/2*V.sc;V.ty=V.h/2-(A.y+B.y)/2*V.sc;}}
    render();
  });
  $('findCount').innerHTML=(t.critical+t.high)?'<span style="color:'+
    (t.critical?SEVC.critical:SEVC.high)+'">\u25cf</span>':'';
}

      const er=R.ER[b.e], Lall=er&&er.branchLall;
      const lallCls=Lall&&b.Lb>Lall?'bad':(Lall&&b.Lb>0.75*Lall?'watch':'ok');
      return '<tr data-node="'+b.n+'"><td>'+(M.nodes[b.n].label||b.n.slice(1,5))+
        '</td><td>'+b.dn+'</td><td>'+fmt(b.lat,0)+'</td><td>'+fmt(b.Lb,1)+'</td>'+
        '<td class="'+(b.Lb<b.Lreq?'bad':'ok')+'">'+fmt(b.Lreq,1)+'</td>'+
        '<td class="'+lallCls+'">'+(Lall?fmt(Lall,1):'\u2013')+'</td>'+
        '<td class="'+cls(b.util)+'">'+fmt(100*b.util,0)+'</td></tr>';}).join('')+
    '</tbody></table></div><div class="note">Lateral movement in mm \u00b7 lengths in m. '+
    '"L req" is the flexibility length. "L(all)" is the max straight length before a bend (flag if L avail > 2\u00d7L(all)).</div>');

  out+=cardF('rE','Export','',
    '<div class="btn2"><button class="btn" id="expSec">Sections CSV</button>'+
    '<button class="btn" id="expFind">Findings CSV</button></div>'+
    '<button class="btn acc" id="expRep" style="margin-top:6px">Open calculation report</button>');
  el.innerHTML=out;
  el.querySelectorAll('[data-sec]').forEach(tr=>tr.onclick=()=>{
    const S=R.sections.find(x=>x.id===tr.dataset.sec);
    if(S)select('edge',S.edges[0].id);});
  el.querySelectorAll('[data-node]').forEach(tr=>tr.onclick=()=>select('node',tr.dataset.node));
  $('expSec').onclick=()=>csv('sections');
  $('expFind').onclick=()=>csv('findings');
  $('expRep').onclick=report;
}

function buildStatus(){
  if(!R){$('status').innerHTML='';return;}
  const s=R.summary,t=R.tally;
  const worst=t.critical?'critical':t.high?'high':t.watch?'watch':'info';
  $('status').innerHTML=
    '<span><b>'+fmt(s.totLen,0)+' m</b> route</span>'+
    '<span><b>'+s.nEdges+'</b> lengths \u00b7 <b>'+s.nSec+'</b> sections</span>'+
    '<span>class <b>'+s.cls+'</b> \u00b7 \u03c3all <b>'+fmt(s.sigAll,0)+'</b> MPa \u00b7 N <b>'+s.N+'</b></span>'+
    '<span>peak <b>'+fmt(s.maxSig,0)+'</b> MPa \u00b7 <b>'+fmt(100*s.maxUtil,0)+'%</b></span>'+
    '<span class="sp"><span class="dot" style="background:'+SEVC[worst]+'"></span>'+
    t.critical+' critical \u00b7 '+t.high+' high \u00b7 '+t.watch+' watch</span>';
}
function buildLegend(){
  const A=R?R.A:{sigAll:190};

    '<div class="lr"><span>0</span><span>'+fmt(A.sigAll/2,0)+'</span><span>'+
    fmt(A.sigAll,0)+' MPa</span></div>'+

}

function run(){

/* ---- SAVE / LOAD / CSV ------------------------------------------------ */
function download(name,text,mime){
  const b=new Blob([text],{type:mime||'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function saveFile(){
  M.meta.name=$('projName').value;
  const o={app:'thermoline',version:1,meta:M.meta,ops:M.ops,soil:M.soil,design:M.design,
    def:M.def,view:M.view,nodes:M.nodes,edges:M.edges};
  download((M.meta.name||'network').replace(/[^\w-]+/g,'_')+'.json',
    JSON.stringify(o,null,1),'application/json');
  toast('Saved');
}
$('btnNew').onclick=()=>{
  if(Object.keys(M.edges).length>0&&!confirm('Start a new project? Unsaved changes will be lost.'))return;
  M=blankModel(); M.meta.name='Untitled network'; $('projName').value=M.meta.name;
  _hudBuilt=false;
  buildProjectPane(); snapshot(); run(); fit();
  toast('New project started');
};
$('btnSave').onclick=saveFile;
$('btnOpen').onclick=()=>$('fileIn').click();
$('fileIn').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const o=JSON.parse(rd.result);
    M=Object.assign(blankModel(),o);M.z={p:[],i:-1};
    $('projName').value=M.meta.name||'Network';
    buildProjectPane();snapshot();run();fit();toast('Opened '+f.name);
  }catch(e){toast('Could not read that file');}};
  rd.readAsText(f); ev.target.value='';
};
$('projName').onchange=e=>{M.meta.name=e.target.value;};
function csv(kind){
  let rows=[];
  if(kind==='sections'){
    rows.push(['Section','Length_m','DN','Series','F_kN_m','As_mm2','LF_m','Lall_m',
      'Sigma_MPa','Utilisation','Locked_m','Move1_mm','Move2_mm','End1','End2']);
    R.sections.forEach(S=>rows.push([S.id,S.L.toFixed(1),
      [...new Set(S.edges.map(e=>e.dn))].join('/'),
      [...new Set(S.edges.map(e=>e.series))].join('/'),
      S.f.toFixed(2),S.As.toFixed(0),S.LF.toFixed(1),S.Lall.toFixed(1),
      S.sig.toFixed(0),(S.util*100).toFixed(0),S.lock.toFixed(1),
      S.d0.toFixed(0),S.d1.toFixed(0),S.e0,S.e1]));
  } else {
    rows.push(['ID','Severity','Code','Title','Detail','Recommendation','Basis']);
    R.findings.forEach(f=>rows.push([f.id,f.sev,f.code,f.title,f.detail,f.fix,f.ref]));
  }
  const out=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  download((M.meta.name||'network')+'-'+kind+'.csv',out,'text/csv');
}

$('btnMethod').onclick=()=>modal('Calculation basis and limitations',`
<h5>What this tool does</h5>
<p>It is a <b>screening</b> calculation for directly buried, bonded pre-insulated steel pipe
(EN 253 assemblies) using the simplified friction-restrained model that EN 13941-1 permits for
general documentation, in the form set out in manufacturers' design manuals (Kingspan LOGSTOR,
isoplus). It finds where axial stress, movement, branch flexibility or fatigue become the
governing issue, so you can place expansion elements and reinforcement before committing to a
detailed model.</p>
<p>It is <b>not</b> a substitute for a finite-element pipe stress analysis in SisKMR, PASS/START-PROF,
CAEPIPE or equivalent. Beyond DN 300 EN 13941 expects a detailed analysis, and the tool flags
this. Nothing here relieves the designer of responsibility for the design.</p>

<h5>Soil friction</h5>
<p><code>F = &mu; [ (1+K&#8320;)/2 &middot; &sigma;'&#7515; &middot; &pi;D&#8330; + G &minus; &gamma; &pi;D&#8330;&sup2;/4 ]</code>&nbsp; kN/m,
with <code>&sigma;'&#7515; = &gamma; Z</code> at casing centreline, <code>Z = H + D&#8330;/2</code>.
G is the self weight of the water-filled assembly. Below the water table the effective unit
weight is used. This reproduces published manufacturer friction tables to within about 1%
(for example DN100 series 2 at 0.8 m cover: 3.37 against 3.35 kN/m).</p>

<h5>Axial stress and friction length</h5>
<p>Fully restrained: <code>&sigma;max = &Delta;T &middot; E &middot; &alpha;</code>, with
<code>E&alpha; = 2.52 MPa/K</code> by default (E = 210 000 MPa, &alpha; = 1.2&times;10&#8315;&#8309;), or
temperature-dependent values from EN 13941 if selected. Internal pressure is not added to the
axial stress: for the diameters normally in classes A and B its contribution is small, but for
class C and thin walls you should check it separately.</p>
<p><code>LF = &sigma;max &middot; As / F</code>. Where a section between expansion points is longer
than 2&middot;LF, a fully restrained (locked) zone forms in the middle. Where it is shorter,
<code>&sigma; = &frac12; L F / As</code> governs.</p>

<h5>Movement</h5>
<p>At a free end or bend: <code>&Delta;L = &alpha; &Delta;T Lx &minus; F Lx&sup2; / (2 As E)</code>,
with Lx the smaller of the distance to the virtual anchor and LF. The resultant at a bend is the
vector sum of the two leg movements. At an interior point such as a branch,
<code>&Delta;LT = &alpha; &Delta;T s &minus; F (2L &minus; s) s / (2 E As)</code>.</p>

<h5>Expansion cushions</h5>
<p>Pad thickness <code>t = &Delta;R / 0.70</code> rounded up to 40 mm layers, capped at three
layers so the casing surface temperature stays inside EN 13941 limits and the PUR compressive
stress stays below 0.15 MPa. The pad zone length F is an empirical fit to the published
manufacturer F-length curves, <code>F = 0.124 d&#8304;&#903;&#8308;&#8312; &Delta;L&#8304;&#903;&#178;&#8309;</code>
(d, &Delta;L in mm), stepped F / &frac12;F / &frac14;F by layer.</p>
<p>Each leg is padded over its own F, driven by the component of the bend's displacement
<i>perpendicular to that leg</i> &mdash; for a right-angle bend that is the other leg's axial
expansion. Thickness is set by the resultant movement, which is conservative for the individual
legs.</p>
<p>The pad zone is then checked for fit. Each leg is walked to the next bend, tee, reducer,
fitting or pipe end, and the F-length is compared with the clear straight pipe actually
available &mdash; pads cannot be laid through a mitred weld or a fitting. Where two padded
bends face each other across a single leg, the manufacturer offset rule
<code>Z &ge; 0.45 (F&#8321; + F&#8322;)</code> is applied; the tool distinguishes a Z offset from a
loop crown from the geometry and notes that the rule is written for the former. Local
excavation width is reported as casing OD + 2 &times; pad thickness + 2 &times; working space, and
checked against a stated maximum trench width and a stated clear gap to an adjacent casing if
you enter them.</p>

<h5>Fatigue</h5>
<p><code>&Delta;&sigma;all = 2811 / N&#8304;&#903;&#178;&#8309; / &gamma;</code> MPa. The constant reproduces
the EN 13941 allowables quoted in the literature (707 MPa at 250 equivalent full cycles, 750 at
200, 823 at 136). Local ranges are multiplied by a stress concentration factor: 1.6 at welded
elbows, and for branches 1.8/2.6 plain, 1.25/1.5 reinforced, 1.15/1.35 forged (run/branch).
These SCFs are screening values &mdash; confirm them against the component supplier's data.</p>

<h5>Branch flexibility</h5>
<p>The branch is treated as a guided cantilever taking the main pipe's axial movement as an
imposed lateral displacement: <code>&sigma;b = 3 E d &Delta; / L&sup2;</code>, so the free length
needed before the first bend or fixed point is
<code>Lreq = &radic;(3 E d &Delta; &middot; SCF / &Delta;&sigma;all)</code>. Soil restraint along the
branch is not modelled, which is why pads are called up over the same length.</p>

<h5>Local stability (limit state C1)</h5>
<p>Maximum axial stress from the EN 13941 r&#8344;/t curve: 334 MPa up to &oslash;323.9, then 308,
279, 249, 225, 212, 205, 198, 200, 198, 188 MPa at &oslash;355.6 to &oslash;1219.</p>

<h5>What is deliberately not covered</h5>
<ul>
<li>Twin pipes &mdash; single-pipe assemblies only. Twin pipe needs the coupled supply/return model.</li>
<li>Vertical geometry, level changes, buoyancy and slope effects.</li>
<li>Traffic and surcharge loads, ovalisation stress, and the PUR/PE stress checks in detail.</li>
<li>Feedback from the pads into the friction model &mdash; F stays at the full soil value over the
padded length, so movements there are marginally under-predicted.</li>
<li>Global (upheaval / lateral) buckling verification.</li>
<li>Valves, reducers and compensator components &mdash; forces are reported, not verified.</li>
<li>Partial safety factors by class are tool defaults; set them to your project's adopted values.</li>
</ul>
`,'<button class="btn" onclick="closeModal()">Close</button>');

/* ---- TEMPLATES -------------------------------------------------------- */
function mkRoute(pts,opts){
  let prev=null,first=null;
  pts.forEach(p=>{
    const id=nodeAt(p[0],p[1])||addNode(p[0],p[1],p[2]||'auto');
    if(p[2])M.nodes[id].type=p[2];
    if(prev!==null)addEdge(prev,id,opts||{});
    else first=id;
    prev=id;
  });
  return{first,last:prev};
}
function nodeAt(x,y){
  for(const n of Object.values(M.nodes))if(Math.hypot(n.x-x,n.y-y)<0.4)return n.id;
  return null;
}

  const T=(h,rows)=>'<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+

  const dl=(o)=>'<dl>'+Object.entries(o).map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>';

  const secRows=R.sections.map(S=>{
    const tags=[...new Set(S.edges.map(e=>REF[e.id]||'').filter(Boolean))];
    const tagTxt=tags.length?(tags[0]+(tags.length>1?'\u2013'+tags[tags.length-1]:'')):'';
    return[S.id+(tagTxt?'<br><span style="color:#8a8a78">'+tagTxt+'</span>':''),
    fmt(S.L,1),[...new Set(S.edges.map(e=>e.dn))].join('/'),
    [...new Set(S.edges.map(e=>e.series))].join('/'),fmt(S.f,2),fmt(S.As,0),fmt(S.LF,1),
    fmt(S.lock,1),fmt(S.sig,0),fmt(100*S.util,0)+'%',fmt(S.d0,0),fmt(S.d1,0),
    S.e0+'/'+S.e1];});
  const bendRows=R.bendReport.map(b=>{
    const tag=REF[b.n]||''; const lbl=M.nodes[b.n].label;
    const nameCell=(tag?tag:b.n.slice(1,6))+(lbl?'<br><span style="color:#8a8a78">'+lbl+'</span>':'');
    return[nameCell,fmt(b.dev,0)+'&deg;',
    fmt(b.sig,0),fmt(b.dR,0),b.layers,b.layers*40,fmt(b.F,1),
    (b.fit?'':'<b class="bad">')+fmt(b.avail,1)+(b.fit?'':'</b>'),fmt(b.trench,2),
    fmt(Math.ceil(b.F*2)/2,1)+' / '+fmt(Math.ceil(b.F)/2,1)+' / '+fmt(Math.ceil(b.F/2)/2,1)];});
  const brRows=R.branchReport.map(b=>{
    const tag=REF[b.n]||''; const lbl=M.nodes[b.n].label;
    const nameCell=(tag?tag:b.n.slice(1,6))+(lbl?'<br><span style="color:#8a8a78">'+lbl+'</span>':'');
    return[nameCell,'DN'+b.dn,
    fmt(b.lat,0),fmt(b.Lb,1),fmt(b.Lreq,1),fmt(b.sigBend,0),fmt(b.dsBr,0),
    fmt(100*b.util,0)+'%',b.Lb<b.Lreq?'<b class="bad">Add bend</b>':'OK'];});

    const tag=REF[t.n]||''; const lbl=M.nodes[t.n].label;

    fmt(t.move,0),fmt(t.dsRun,0),fmt(A.dsFat,0),fmt(100*t.util,0)+'%',
    t.util>1?'<b class="bad">Reinforce</b>':t.util>0.85?'<b class="warn">Review</b>':'OK'];});
  const anchors=Object.values(M.nodes).filter(n=>R.NR[n.id]&&R.NR[n.id].role==='anchor')
    .map(n=>{
      const tag=REF[n.id]||'';
      const nameCell=(tag?tag:n.id.slice(1,6))+(n.label?'<br><span style="color:#8a8a78">'+n.label+'</span>':'');
      return[nameCell,fmt(n.x,1)+', '+fmt(n.y,1),fmt(R.NR[n.id].sig,0),

  '.sev.critical{background:#8f1f17}.sev.high{background:#c1531c}.sev.watch{background:#a8790a}'+
  '.sev.info{background:#5c6300}'+
  '.bad{color:#8f1f17}.warn{color:#8a6600}'+
  '.box{background:#f8f8f0;border-left:3px solid #8a9600;padding:9px 12px;margin:10px 0;font-size:10.5px;line-height:1.6}'+
  'i{color:#5c6300;font-style:normal}'+
  'footer{margin-top:26px;padding-top:9px;border-top:1px solid #d8d8d0;font-size:9.5px;color:#6b6b62}'+
  '@media print{.noprint{display:none}}'+
  '</style></head><body>'+
  '<div class="head"><div><h1>'+(m.name||'Untitled network')+'</h1>'+

  '<div class="box"><b>Status of this document.</b> This is a screening calculation using the '+

  'Fully restrained stress \u03c3 = \u0394T\u00b7E\u00b7\u03b1. Friction length LF = \u03c3\u00b7As/F. '+
  'Movement \u0394L = \u03b1\u0394T\u00b7Lx \u2212 F\u00b7Lx\u00b2/(2\u00b7As\u00b7E); at an interior point '+
